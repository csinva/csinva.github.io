<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" role="img" aria-labelledby="title desc">
  <title id="title">Coverage space (N, P)</title>
  <desc id="desc">Rectangle with negatives covered on the x axis from 0 to N and positives covered on the y axis from 0 to P. Nine evenly spaced dashed vertical lines and a dotted diagonal from (0, 0) to (N, P).</desc>
  <!-- drawn dark-on-transparent: the notes CSS inverts images (keeping hue) for the black background -->
  <defs>
    <style>
      .ln { fill: none; stroke: #2b2b2b; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .lbl { font: 22px Helvetica, Arial, sans-serif; fill: #2b2b2b; }
      .var { font: italic 24px Georgia, "Times New Roman", serif; fill: #2b2b2b; }
      .mid { text-anchor: middle; }
      .end { text-anchor: end; }
      .big { font: 32px Helvetica, Arial, sans-serif; fill: #2b2b2b; }
    </style>
  </defs>

  <rect x="50" y="20" width="540" height="360" fill="none" stroke="#2b2b2b" stroke-width="2"/>
  <line x1="104.0" y1="20" x2="104.0" y2="380" stroke="#2b2b2b" stroke-width="1.6" stroke-dasharray="9 6"/>
  <line x1="158.0" y1="20" x2="158.0" y2="380" stroke="#2b2b2b" stroke-width="1.6" stroke-dasharray="9 6"/>
  <line x1="212.0" y1="20" x2="212.0" y2="380" stroke="#2b2b2b" stroke-width="1.6" stroke-dasharray="9 6"/>
  <line x1="266.0" y1="20" x2="266.0" y2="380" stroke="#2b2b2b" stroke-width="1.6" stroke-dasharray="9 6"/>
  <line x1="320.0" y1="20" x2="320.0" y2="380" stroke="#2b2b2b" stroke-width="1.6" stroke-dasharray="9 6"/>
  <line x1="374.0" y1="20" x2="374.0" y2="380" stroke="#2b2b2b" stroke-width="1.6" stroke-dasharray="9 6"/>
  <line x1="428.0" y1="20" x2="428.0" y2="380" stroke="#2b2b2b" stroke-width="1.6" stroke-dasharray="9 6"/>
  <line x1="482.0" y1="20" x2="482.0" y2="380" stroke="#2b2b2b" stroke-width="1.6" stroke-dasharray="9 6"/>
  <line x1="536.0" y1="20" x2="536.0" y2="380" stroke="#2b2b2b" stroke-width="1.6" stroke-dasharray="9 6"/>
  <line x1="50" y1="380" x2="590" y2="20" stroke="#2b2b2b" stroke-width="1.6" stroke-dasharray="2 4" stroke-linecap="round"/>
  <line x1="42" y1="20" x2="50" y2="20" stroke="#2b2b2b" stroke-width="2"/><line x1="42" y1="380" x2="50" y2="380" stroke="#2b2b2b" stroke-width="2"/>
  <line x1="50" y1="380" x2="50" y2="388" stroke="#2b2b2b" stroke-width="2"/><line x1="590" y1="380" x2="590" y2="388" stroke="#2b2b2b" stroke-width="2"/>
  <text class="big end" x="38" y="31">P</text><text class="big end" x="38" y="391">0</text>
  <text class="big mid" x="50" y="424">0</text><text class="big mid" x="590" y="424">N</text>
</svg>