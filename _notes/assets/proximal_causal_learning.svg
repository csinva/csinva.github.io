<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 10 812 260" role="img" aria-labelledby="title desc">
  <title id="title">Proximal causal inference DAGs</title>
  <desc id="desc">Two causal graphs over U, Z, X, W, A, Y. Both: U points to Z, X, W, A and Y; X points to Z, W, A and Y; A points to Y. The left graph additionally has Z to A and W to Y.</desc>
  <!-- drawn dark-on-transparent: the notes CSS inverts images (keeping hue) for the black background -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/>
    </marker>
    <style>
      text { font-family: Helvetica, Arial, sans-serif; fill: #2b2b2b; }
      .c { text-anchor: middle; }
      .e { text-anchor: end; }
      .b { font-weight: bold; }
      .note { font-family: Georgia, "Times New Roman", serif; }
      .line { fill: none; stroke: #2b2b2b; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .lead { fill: none; stroke: #2b2b2b; stroke-width: 1.5; stroke-linecap: round; }
      .mid { fill: none; stroke: #2b2b2b; stroke-width: 2; stroke-dasharray: 3 5; stroke-linecap: round; }
      .var { font: 24px Georgia, "Times New Roman", serif; text-anchor: middle; }
    </style>
  </defs>
