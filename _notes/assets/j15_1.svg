<svg xmlns="http://www.w3.org/2000/svg" viewBox="118 0 432 208" role="img" aria-labelledby="title desc">
  <title id="title">State space model as a graphical model</title>
  <desc id="desc">Hidden states x_0, x_1, x_2, ..., x_T in a chain linked by matrix A, with initial covariance Sigma_0; each state emits an observed output y_t (shaded) through matrix C.</desc>
  <!-- drawn dark-on-transparent: the notes CSS inverts images (keeping hue) for the black background -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/>
    </marker>
    <marker id="garrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f8a4c"/>
    </marker>
    <style>
      .node { fill: #ffffff; stroke: #2b2b2b; stroke-width: 2; }
      .obs { fill: #a0a0a0; stroke: #2b2b2b; stroke-width: 2; }
      .edge { fill: none; stroke: #2b2b2b; stroke-width: 2; stroke-linecap: round; }
      .var { font: italic 26px Georgia, "Times New Roman", serif; fill: #2b2b2b; text-anchor: middle; }
      .sub { font-size: 18px; font-family: "Times New Roman", Times, serif; }
      .lab { font: 22px Helvetica, Arial, sans-serif; fill: #2b2b2b; text-anchor: middle; }
    </style>
  </defs>
  <line class="edge" x1="182.5" y1="76.0" x2="182.5" y2="129.0" marker-end="url(#arrow)"/>
  <line class="edge" x1="272.5" y1="76.0" x2="272.5" y2="129.0" marker-end="url(#arrow)"/>
  <line class="edge" x1="365.0" y1="76.0" x2="365.0" y2="129.0" marker-end="url(#arrow)"/>
  <line class="edge" x1="523.5" y1="76.0" x2="523.5" y2="129.0" marker-end="url(#arrow)"/>
  <line class="edge" x1="201.0" y1="57.5" x2="253.0" y2="57.5" marker-end="url(#arrow)"/>
  <line class="edge" x1="291.0" y1="57.5" x2="345.5" y2="57.5" marker-end="url(#arrow)"/>
  <line class="edge" x1="383.5" y1="57.5" x2="400" y2="57.5"/>
  <line class="edge" x1="482" y1="57.5" x2="504.0" y2="57.5" marker-end="url(#arrow)"/>
  <circle cx="435" cy="57.5" r="2.6" fill="#2b2b2b"/>
  <circle cx="445" cy="57.5" r="2.6" fill="#2b2b2b"/>
  <circle cx="455" cy="57.5" r="2.6" fill="#2b2b2b"/>
  <circle class="node" cx="182.5" cy="57.5" r="18.5"/>
  <circle class="obs" cx="182.5" cy="148.5" r="18.5"/>
  <text class="var" x="182.5" y="26">x<tspan class="sub" dy="5">0</tspan></text>
  <text class="var" x="182.5" y="198">y<tspan class="sub" dy="5">0</tspan></text>
  <circle class="node" cx="272.5" cy="57.5" r="18.5"/>
  <circle class="obs" cx="272.5" cy="148.5" r="18.5"/>
  <text class="var" x="272.5" y="26">x<tspan class="sub" dy="5">1</tspan></text>
  <text class="var" x="272.5" y="198">y<tspan class="sub" dy="5">1</tspan></text>
  <circle class="node" cx="365.0" cy="57.5" r="18.5"/>
  <circle class="obs" cx="365.0" cy="148.5" r="18.5"/>
  <text class="var" x="365.0" y="26">x<tspan class="sub" dy="5">2</tspan></text>
  <text class="var" x="365.0" y="198">y<tspan class="sub" dy="5">2</tspan></text>
  <circle class="node" cx="523.5" cy="57.5" r="18.5"/>
  <circle class="obs" cx="523.5" cy="148.5" r="18.5"/>
  <text class="var" x="523.5" y="26">x<tspan class="sub" dy="5">T</tspan></text>
  <text class="var" x="523.5" y="198">y<tspan class="sub" dy="5">T</tspan></text>
  <text class="var" x="162.5" y="111">C</text>
  <text class="var" x="253.5" y="111">C</text>
  <text class="var" x="345.0" y="111">C</text>
  <text class="var" x="504.0" y="111">C</text>
  <text class="var" x="223.5" y="50">A</text>
  <text class="var" x="316.0" y="50">A</text>
  <text class="var" x="140" y="66" style="font-style:normal">Σ<tspan class="sub" dy="5">0</tspan></text>
</svg>
