      .var { font: italic 24px Georgia, "Times New Roman", serif; fill: #2b2b2b; }
      .mid { text-anchor: middle; }
      .end { text-anchor: end; }
      .t1 { font: bold 46px Helvetica, Arial, sans-serif; fill: #1f6fb2; }
      .t2 { font: bold 30px Helvetica, Arial, sans-serif; fill: #1f6fb2; }
      .st { font: bold 27px Helvetica, Arial, sans-serif; }
      .lb { font: 34px Helvetica, Arial, sans-serif; }
      .sb { font-size: 22px; }
      .cell { stroke: #2b2b2b; stroke-width: 1.2; }
      .ga { fill: none; stroke: #8a8a8a; stroke-width: 4; }
    </style>
