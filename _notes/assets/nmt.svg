<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1446 780" role="img" aria-labelledby="title desc">
  <title id="title">Seq2seq with attention, decoding</title>
  <desc id="desc">Neural machine translation, sequence-to-sequence model with attention. Encoding stage produces hidden states h1, h2, h3. In the attention decoding stage, at step 4 the decoder RNN takes h_init and the END token embedding and outputs h4; Attention4 scores the encoder states against h4 to produce context vector C4; C4 and h4 are concatenated and passed through a feed-forward layer to output the word I. Step 5 repeats with the embedding of I as input, giving h5, Attention5, context C5 and output am.</desc>
