<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 0 1950 800" role="img" aria-labelledby="title desc">
  <title id="title">VAE vs WAE</title>
  <desc id="desc">Two panels, each with latent space 𝒵 (top) and data space 𝒳 (bottom). Circles are data points, triangles latent codes, squares reconstructions. Blue arrows: encoder Q(Z|X); black arrows: decoder P_G(X|Z); red arrows: reconstruction. (a) VAE: each encoded point has its own distribution (red discs) inside the prior P_Z; VAE reconstruction. (b) WAE: the aggregate encoded distribution Q_Z (green) is matched to the prior P_Z; WAE reconstruction.</desc>
  <!-- drawn dark-on-transparent: the notes CSS inverts images (keeping hue) for the black background; gradient-shaded discs simplified to flat translucent discs -->
  <defs>
    <marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb2"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d1342f"/></marker>
    <style>
      .zr { fill: #1f6fb2; fill-opacity: 0.16; }
      .xr { fill: #1f6fb2; fill-opacity: 0.06; }
      .sep { stroke: #2b2b2b; stroke-width: 2; }
      .tri { fill: #1f8a4c; fill-opacity: 0.15; stroke: #2b2b2b; stroke-width: 3; stroke-linejoin: round; }
      .sq { fill: #d1342f; fill-opacity: 0.2; stroke: #2b2b2b; stroke-width: 3; }
      .dt { fill: #d9822b; fill-opacity: 0.2; stroke: #2b2b2b; stroke-width: 3; }
      .k { fill: none; stroke: #2b2b2b; stroke-width: 3.5; }
      .b { fill: none; stroke: #1f6fb2; stroke-width: 3.5; }
      .r { fill: none; stroke: #d1342f; stroke-width: 3.5; }
      .h { font: 48px Georgia, "Times New Roman", serif; fill: #2b2b2b; text-anchor: middle; }
      .t { font: 50px Georgia, "Times New Roman", serif; }
      .m { font: italic 54px Georgia, "Times New Roman", serif; fill: #2b2b2b; }
      .s { font-size: 36px; }
      .blue { fill: #1f6fb2; }
      .red { fill: #d1342f; }
      .green { fill: #1f8a4c; }
    </style>
  </defs>
<text class="h" x="478" y="56">(a) VAE</text><text class="h" x="1538" y="56">(b) WAE</text>
