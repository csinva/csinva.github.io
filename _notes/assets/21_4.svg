<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 448" role="img" aria-labelledby="title desc">
  <title id="title">Autonomic outflow levels</title>
  <desc id="desc">Schematic of autonomic outflow. In the medulla, the dorsal nucleus of vagus (blue) projects to a parasympathetic ganglion; sensory feedback goes to the nucleus of the solitary tract (yellow). Spinal cord sections at cervical, thoracic, lumbar and sacral levels each project to a chain of red sympathetic ganglia, the top two being the superior cervical ganglion (scg) and the stellate ganglion.</desc>
  <!-- drawn dark-on-transparent: the notes CSS inverts images (keeping hue) for the black background -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/></marker>
    <marker id="arry" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b88a00"/></marker>
    <style>
      text { font-family: Helvetica, Arial, sans-serif; fill: #2b2b2b; font-size: 17px; }
      .lvl { font-size: 26px; }
      .tis { fill: #e2e2e2; stroke: #9a9a9a; stroke-width: 1.5; }
      .gm { fill: #bdbdbd; }
      .ln { fill: none; stroke: #2b2b2b; stroke-width: 1.8; stroke-linecap: round; }
    </style>
  </defs>
  <!-- medulla -->
  <path class="tis" d="M100 82 C100 52 140 44 205 44 C270 44 310 52 310 82 C310 116 285 150 232 156 L205 150 L178 156 C125 150 100 116 100 82 Z"/>
  <circle cx="180" cy="86" r="10" class="gm"/><circle cx="230" cy="86" r="10" class="gm"/>
  <circle cx="190" cy="112" r="13" fill="#b88a00"/><circle cx="220" cy="112" r="13" fill="#b88a00"/>
  <circle cx="190" cy="62" r="9" fill="#1f6fb2"/><circle cx="220" cy="62" r="9" fill="#1f6fb2"/>
  <text x="214" y="24">Dorsal nucleus of vagus</text>
  <text x="6" y="18">Sensory feedback to</text>
  <text x="6" y="38">nucleus of solitary tract</text>
  <path d="M110 48 L172 104" fill="none" stroke="#b88a00" stroke-width="3" stroke-linecap="round" marker-end="url(#arry)"/>
  <path class="ln" d="M220 62 C232 95 250 125 300 120 C340 116 370 100 393 102" marker-end="url(#arr)"/>
  <circle cx="402" cy="103" r="8" fill="#1f6fb2"/>
  <text x="330" y="62">Parasympathetic</text>
  <text x="330" y="82">ganglion</text>
  <!-- sympathetic chain -->
  <circle cx="420" cy="140" r="13" fill="#d1342f"/>
  <circle cx="420" cy="175" r="15" fill="#d1342f"/>
  <text x="362" y="146">scg</text>
  <text x="336" y="181">stellate</text>

  <circle cx="420" cy="205" r="8" fill="#d1342f"/>
  <circle cx="420" cy="223" r="8" fill="#d1342f"/>
  <circle cx="420" cy="241" r="8" fill="#d1342f"/>
  <circle cx="420" cy="259" r="8" fill="#d1342f"/>
  <circle cx="420" cy="277" r="8" fill="#d1342f"/>
  <circle cx="420" cy="295" r="8" fill="#d1342f"/>
  <circle cx="420" cy="313" r="8" fill="#d1342f"/>
  <circle cx="420" cy="331" r="8" fill="#d1342f"/>
  <circle cx="420" cy="349" r="8" fill="#d1342f"/>
  <circle cx="420" cy="367" r="8" fill="#d1342f"/>
  <circle cx="420" cy="385" r="8" fill="#d1342f"/>
  <circle cx="420" cy="403" r="8" fill="#d1342f"/>
  <circle cx="420" cy="421" r="8" fill="#d1342f"/>
  <text class="lvl" x="10" y="199">cervical</text>
  <circle class="tis" cx="187" cy="190" r="27"/><circle class="tis" cx="233" cy="190" r="27"/>
  <path class="gm" d="M180 170 q8 4 12 14 q6 4 13 4 q7 0 13 -4 q4 -10 12 -14 q8 10 -2 24 q2 10 8 14 q-10 4 -16 -6 q-8 -4 -15 -4 q-7 0 -15 4 q-6 10 -16 6 q6 -4 8 -14 q-10 -14 -2 -24 z"/>
  <path class="ln" d="M247 194 C258 208 270 205 300 205 H407" marker-end="url(#arr)"/>
  <text class="lvl" x="10" y="271">thoracic</text>
  <circle class="tis" cx="187" cy="262" r="27"/><circle class="tis" cx="233" cy="262" r="27"/>
  <path class="gm" d="M180 242 q8 4 12 14 q6 4 13 4 q7 0 13 -4 q4 -10 12 -14 q8 10 -2 24 q2 10 8 14 q-10 4 -16 -6 q-8 -4 -15 -4 q-7 0 -15 4 q-6 10 -16 6 q6 -4 8 -14 q-10 -14 -2 -24 z"/>
  <path class="ln" d="M247 266 C258 280 270 277 300 277 H407" marker-end="url(#arr)"/>
  <text class="lvl" x="10" y="343">lumbar</text>
  <circle class="tis" cx="187" cy="334" r="27"/><circle class="tis" cx="233" cy="334" r="27"/>
  <path class="gm" d="M180 314 q8 4 12 14 q6 4 13 4 q7 0 13 -4 q4 -10 12 -14 q8 10 -2 24 q2 10 8 14 q-10 4 -16 -6 q-8 -4 -15 -4 q-7 0 -15 4 q-6 10 -16 6 q6 -4 8 -14 q-10 -14 -2 -24 z"/>
  <path class="ln" d="M247 338 C258 352 270 349 300 349 H407" marker-end="url(#arr)"/>
  <text class="lvl" x="10" y="415">sacral</text>
  <circle class="tis" cx="187" cy="406" r="27"/><circle class="tis" cx="233" cy="406" r="27"/>
  <path class="gm" d="M180 386 q8 4 12 14 q6 4 13 4 q7 0 13 -4 q4 -10 12 -14 q8 10 -2 24 q2 10 8 14 q-10 4 -16 -6 q-8 -4 -15 -4 q-7 0 -15 4 q-6 10 -16 6 q6 -4 8 -14 q-10 -14 -2 -24 z"/>
  <path class="ln" d="M247 410 C258 424 270 421 300 421 H407" marker-end="url(#arr)"/>
</svg>
