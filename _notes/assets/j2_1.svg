<svg xmlns="http://www.w3.org/2000/svg" viewBox="140 16 500 270" role="img" aria-labelledby="title desc">
  <title id="title">Marginal independence and the v-structure</title>
  <desc id="desc">(a) A v-structure: X and Z both point to Y; the missing edge between X and Z encodes X independent of Z. (b) The subgraph on X and Z alone: two unconnected nodes.</desc>
  <!-- drawn dark-on-transparent: the notes CSS inverts images (keeping hue) for the black background -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/>
    </marker>
    <marker id="garrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f8a4c"/>
    </marker>
    <style>
      .node { fill: #ffffff; stroke: #2b2b2b; stroke-width: 2; }
      .obs { fill: #a0a0a0; stroke: #2b2b2b; stroke-width: 2; }
      .edge { fill: none; stroke: #2b2b2b; stroke-width: 2; stroke-linecap: round; }
      .var { font: italic 26px Georgia, "Times New Roman", serif; fill: #2b2b2b; text-anchor: middle; }
      .sub { font-size: 18px; font-family: "Times New Roman", Times, serif; }
      .lab { font: 22px Helvetica, Arial, sans-serif; fill: #2b2b2b; text-anchor: middle; }
    </style>
  </defs>
  <line class="edge" x1="184.9" y1="90.2" x2="226.6" y2="158.9" marker-end="url(#arrow)"/>
  <line class="edge" x1="291.8" y1="90.0" x2="247.7" y2="159.1" marker-end="url(#arrow)"/>
  <circle class="node" cx="175.0" cy="74.0" r="19"/>
  <circle class="node" cx="302.0" cy="74.0" r="19"/>
  <circle class="node" cx="237.0" cy="176.0" r="19"/>
  <text class="var" x="175" y="42">X</text>
  <text class="var" x="302" y="42">Z</text>
  <text class="var" x="237" y="228">Y</text>
  <circle class="node" cx="473.0" cy="118.0" r="19"/>
  <circle class="node" cx="600.0" cy="118.0" r="19"/>
  <text class="var" x="473" y="86">X</text>
  <text class="var" x="600" y="86">Z</text>
  <text class="lab" x="237" y="276">(a)</text>
  <text class="lab" x="536" y="276">(b)</text>
</svg>
