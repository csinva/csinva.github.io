<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 6 962 400" role="img" aria-labelledby="title desc">
  <title id="title">Circuit model</title>
  <desc id="desc">Compartmental circuit model of a branching neuron: a chain of series resistors with, at each compartment node, a parallel resistor and capacitor to ground. Two proximal compartments lead to a junction that splits into an upper branch (one compartment, then a second split into two branches of three compartments each) and a lower branch of four compartments.</desc>
