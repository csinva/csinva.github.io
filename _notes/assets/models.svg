<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 22 978 418" role="img" aria-labelledby="title desc">
  <title id="title">Relationships among graphical models</title>
  <desc id="desc">Generative models (top: naive Bayes, HMMs, generative directed models) and their conditional counterparts (bottom: logistic regression, linear-chain CRFs, general CRFs). Arrows labeled SEQUENCE and GENERAL GRAPHS go left to right; arrows labeled CONDITIONAL go from each top model down to its counterpart. Dark nodes are observed; small black squares are factors.</desc>
  <!-- drawn dark-on-transparent: the notes CSS inverts images (keeping hue) for the black background -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/>
    </marker>
    <marker id="garrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f8a4c"/>
    </marker>
    <style>
