      .edge { fill: none; stroke: #2b2b2b; stroke-width: 2; stroke-linecap: round; }
      .var { font: italic 26px Georgia, "Times New Roman", serif; fill: #2b2b2b; text-anchor: middle; }
      .sub { font-size: 18px; font-family: "Times New Roman", Times, serif; }
      .lab { font: 22px Helvetica, Arial, sans-serif; fill: #2b2b2b; text-anchor: middle; }
      .fac { fill: #2b2b2b; }
      .big { fill: #ffffff; stroke: #2b2b2b; stroke-width: 1.5; stroke-linejoin: miter; }
      .kw { font: bold 22px "Arial Narrow", Helvetica, Arial, sans-serif; fill: #2b2b2b; text-anchor: middle; letter-spacing: 0.5px; stroke: #ffffff; stroke-width: 5px; paint-order: stroke; stroke-linejoin: round; }
      .name { font: 18px Helvetica, Arial, sans-serif; fill: #2b2b2b; text-anchor: middle; }
      .note { font: 16px Helvetica, Arial, sans-serif; fill: #2b2b2b; }
    </style>
