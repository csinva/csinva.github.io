<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1990 885" role="img" aria-labelledby="title desc">
  <title id="title">I-Con periodic table of representation learning</title>
  <desc id="desc">Table from the I-Con paper. Columns give the supervisory signal (Gaussian, Student-T, Identity, Graph Kernel Weights, Uniform over K-Neighbors, Uniform over Positive Pairs, Cross-Modal Pairs, Uniform over Classes, Data-Label Pairs); rows give the learned representation (Gaussian, Gaussian sigma to infinity, Gaussian sigma to 0, Student-T, Uniform on Clusters). Cells name the method recovered by each pairing, colored by family: dimensionality reduction, cluster learning, unimodal SSL, multimodal SSL, supervised learning, and gray interpretations of gaps.</desc>
  <!-- drawn dark-on-transparent: the notes CSS inverts images (keeping hue) for the black background -->
  <defs>
    <style>
      .grid rect, .grid line { fill: none; stroke: #2b2b2b; stroke-width: 2.5; }
      .thin line { stroke: #2b2b2b; stroke-width: 1.2; }
      .name { font: 25px Helvetica, Arial, sans-serif; fill: #2b2b2b; text-anchor: middle; }
      .cite { font: 20px Helvetica, Arial, sans-serif; fill: #2b2b2b; text-anchor: middle; }
      .hd { font: 28px Helvetica, Arial, sans-serif; fill: #2b2b2b; text-anchor: middle; }
      .ttl { font: 34px Helvetica, Arial, sans-serif; fill: #2b2b2b; text-anchor: middle; }
      .leg { font: 27px Helvetica, Arial, sans-serif; fill: #2b2b2b; }
    </style>
  </defs>
