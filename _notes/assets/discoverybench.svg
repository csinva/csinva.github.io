<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 8 1984 472" role="img" aria-labelledby="title desc">
  <title id="title">DiscoveryBench overview</title>
  <desc id="desc">DiscoveryBench task: a dataset (habitat type with counts of nonnative gardening, unintentional and agriforest plants and elevation, for croplands, wetlands, urban) and a goal: how did urban land use affect the invasion of different types of introduced plants in Catalonia? The discovery agent workflow filters for urban habitat, fits a binomial GLM with logit link, checks spatial autocorrelation with Moran's I in PySAL, and uses statsmodels diagnostics, giving the final answer that urban land use increased invasion by agriforest plants over gardening introduced ones. Evaluation compares gold vs predicted context (urban habitat type, score 1.0), variable (gardening, unintentional vs gardening, agriforst; 0.3) and relationship (reduced vs increased; 0.0), final score 0.21.</desc>
