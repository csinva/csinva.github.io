  <text x="20" y="328" font-size="30" font-weight="normal" fill="#2b2b2b" text-anchor="start"><tspan font-weight="bold">Goal:</tspan> How did urban land use affect the</text>
  <text x="20" y="368" font-size="30" font-weight="normal" fill="#2b2b2b" text-anchor="start">invasion of different types of introduced</text>
  <text x="20" y="406" font-size="30" font-weight="normal" fill="#2b2b2b" text-anchor="start">plants in Catalonia?</text>
  <text x="334" y="464" font-size="40" font-weight="bold" fill="#2b2b2b" text-anchor="middle">DiscoveryBench Task</text>
  <line x1="654" y1="216" x2="700" y2="216" stroke="#2b2b2b" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="708" y="16" width="626" height="402" fill="#eef7ea" stroke="#1f8a4c" stroke-width="3"/>
  <text x="716" y="58" font-size="28" font-weight="bold" fill="#2b2b2b" text-anchor="start">Workflow:</text>
  <text x="716" y="94" font-size="25" font-weight="normal" fill="#2b2b2b" text-anchor="start">1. Filter for habitat type: urban</text>
  <text x="716" y="127" font-size="25" font-weight="normal" fill="#2b2b2b" text-anchor="start">2. GLM with a binomial outcome and a logit function</text>
  <text x="716" y="160" font-size="25" font-weight="normal" fill="#2b2b2b" text-anchor="start">to model binary data</text>
  <text x="716" y="193" font-size="25" font-weight="normal" fill="#2b2b2b" text-anchor="start">3. Check spatial autocorrelation among data points</text>
  <text x="716" y="226" font-size="25" font-weight="normal" fill="#2b2b2b" text-anchor="start">using Moran's I-statistic with PySAL</text>
  <text x="716" y="259" font-size="25" font-weight="normal" fill="#2b2b2b" text-anchor="start">4. Use statsmodels.stats.diagnostic to assess model ...</text>
  <text x="716" y="318" font-size="30" font-weight="normal" fill="#2b2b2b" text-anchor="start"><tspan font-weight="bold">Final Answer:</tspan> Urban land use increased</text>
  <text x="716" y="356" font-size="30" font-weight="normal" fill="#2b2b2b" text-anchor="start">invasion by agriforest plants over gardening</text>
  <text x="716" y="394" font-size="30" font-weight="normal" fill="#2b2b2b" text-anchor="start">introduced ones in Catalonia.</text>
  <text x="1021" y="464" font-size="40" font-weight="bold" fill="#2b2b2b" text-anchor="middle">Discovery Agent Workflow</text>
