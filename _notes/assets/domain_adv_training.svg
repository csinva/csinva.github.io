<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1960 830" role="img" aria-labelledby="title desc">
  <title id="title">Domain-adversarial training</title>
  <desc id="desc">Domain-adversarial neural network. An input x passes through a feature extractor G_f(.; theta_f) (green layers) to features f. The features feed a label predictor G_y(.; theta_y) (blue) producing class label y with loss L_y, and, through a gradient reversal layer, a domain classifier G_d(.; theta_d) (pink) producing domain label d with loss L_d. Backprop sends dL_y/dtheta_y to the label predictor and dL_y/dtheta_f to the feature extractor; the domain classifier receives lambda dL_d/dtheta_d, and the gradient reversal layer flips the sign so the feature extractor receives -lambda dL_d/dtheta_f. Legend: block arrows are forwardprop; thin arrows with boxed fractions are backprop and the produced derivatives.</desc>
