<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 1144 960" role="img" aria-labelledby="title desc">
  <title id="title">Maxwell's demon sketch</title>
  <desc id="desc">Two gas chambers, tau 1 on the left (red wall, mostly slow red molecules with short arrows) and tau 2 on the right (blue wall, mostly fast blue molecules with long arrows), joined by a channel closed by an orange door. An arrow above the door points up (door opening). A slow red molecule approaches the door from the left and another sits just past it on the right; a fast blue molecule in the left chamber heads away to the left.</desc>
  <!-- drawn dark-on-transparent: the notes CSS inverts images (keeping hue) for the black background -->
  <defs>
    <style>
      .ln { fill: none; stroke: #2b2b2b; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .lbl { font: 22px Helvetica, Arial, sans-serif; fill: #2b2b2b; }
      .var { font: italic 24px Georgia, "Times New Roman", serif; fill: #2b2b2b; }
      .mid { text-anchor: middle; }
      .end { text-anchor: end; }
      .w { fill: none; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .tau { font: italic 92px "Times New Roman", Times, serif; }
      .sb { font-size: 56px; font-style: normal; }
    </style>
  </defs>

