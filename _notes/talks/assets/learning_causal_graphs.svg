<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1530 374" role="img" aria-labelledby="title desc">
  <title id="title">Learning latent causal graphs</title>
  <desc id="desc">Encoder q_ϕ(z|x) maps observed trajectories x_i^1…x_i^T, x_j^1…x_j^T of several objects to a latent interaction graph whose directed edges z_ij connect the objects. A decoder p_θ(x|z) takes this graph together with the current states x_i^t, x_j^t and predicts the next states x_i^(t+1), x_j^(t+1).</desc>
  <!-- drawn dark-on-transparent: the notes CSS inverts images (keeping hue) for the black background -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/>
    </marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a4a4a"/>
    </marker>
    <style>
      .arr { fill: none; stroke: #2b2b2b; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .ed { fill: none; stroke: #4a4a4a; stroke-width: 3; stroke-linecap: round; }
      .trap { fill: #2b2b2b; fill-opacity: 0.12; stroke: #2b2b2b; stroke-width: 4; stroke-linejoin: round; }
      .gbox { fill: #8a8a8a; fill-opacity: 0.1; }
      .bbox { fill: #1f6fb2; fill-opacity: 0.1; }
      .mx { font: italic 32px Georgia, "Times New Roman", serif; fill: #2b2b2b; }
      .ml { font: italic 44px Georgia, "Times New Roman", serif; fill: #2b2b2b; }
      .ss { font: italic 22px "Times New Roman", Times, serif; fill: #2b2b2b; }
      .ml .ss { font-size: 30px; }
      .nl { font: italic bold 30px Georgia, "Times New Roman", serif; fill: #2b2b2b; text-anchor: middle; }
    </style>
  </defs>
  <!-- observed trajectories -->
  <rect class="gbox" x="10" y="120" width="190" height="176" rx="30"/>
  <text class="mx" x="28" y="182">x</text><text class="ss" x="45" y="168"><tspan font-style="normal">1</tspan></text><text class="ss" x="45" y="191">i</text><text class="mx" x="62" y="182">…</text><text class="mx" x="104" y="182">x</text><text class="ss" x="121" y="168">T</text><text class="ss" x="121" y="191">i</text>
  <text class="mx" x="28" y="236">x</text><text class="ss" x="45" y="222"><tspan font-style="normal">1</tspan></text><text class="ss" x="45" y="245">j</text><text class="mx" x="62" y="236">…</text><text class="mx" x="104" y="236">x</text><text class="ss" x="121" y="222">T</text><text class="ss" x="121" y="245">j</text>
  <text class="mx" x="105" y="276" text-anchor="middle">··</text>
  <path class="arr" d="M200 208 H246" marker-end="url(#arrow)"/>
  <!-- encoder -->
  <path class="trap" d="M250 104 L460 150 V266 L250 312 Z"/>
  <text class="ml" x="355" y="222" text-anchor="middle">q<tspan class="ss" dy="10">ϕ</tspan><tspan dy="-10">(z|x)</tspan></text>
  <path class="arr" d="M460 208 H506" marker-end="url(#arrow)"/>
  <!-- latent interaction graph -->
  <rect class="bbox" x="510" y="48" width="320" height="320" rx="34"/>
  <path class="ed" d="M692.1 134.1 L739.1 172.3" marker-end="url(#ah)"/>
  <text class="mx" x="712" y="138" style="font-size:24px">z<tspan class="ss" dy="7" style="font-size:18px">ij</tspan></text>
  <path class="ed" d="M603.0 189.0 L731.0 189.0" marker-end="url(#ah)"/>
  <path class="ed" d="M732.0 201.0 L604.0 201.0" marker-end="url(#ah)"/>
  <path class="ed" d="M619.3 278.3 L655.5 146.7" marker-end="url(#ah)"/>
  <path class="ed" d="M696.9 291.1 L596.9 216.5" marker-end="url(#ah)"/>
  <path class="ed" d="M755.2 227.9 L737.2 278.1" marker-end="url(#ah)"/>
  <circle cx="665" cy="112" r="32" fill="#1f6fb2"/><text class="nl" x="665" y="122">i</text>
  <circle cx="568" cy="195" r="32" fill="#d9822b"/>
  <circle cx="767" cy="195" r="32" fill="#1f8a4c"/><text class="nl" x="767" y="205">j</text>
  <circle cx="610" cy="312" r="32" fill="#d1342f"/>
  <circle cx="725" cy="312" r="32" fill="#7b4fb5"/>
  <path class="arr" d="M830 208 H1056" marker-end="url(#arrow)"/>
  <!-- current state -->
  <rect class="gbox" x="866" y="4" width="170" height="156" rx="30"/>
  <text class="mx" x="936" y="58">x</text><text class="ss" x="953" y="44">t</text><text class="ss" x="953" y="67">i</text>
  <text class="mx" x="936" y="110">x</text><text class="ss" x="953" y="96">t</text><text class="ss" x="953" y="119">j</text>
  <text class="mx" x="951" y="146" text-anchor="middle">··</text>
  <path class="arr" d="M951 160 V176 Q951 186 961 186 H1056" marker-end="url(#arrow)"/>
  <!-- decoder -->
  <path class="trap" d="M1060 150 L1270 104 V312 L1060 266 Z"/>
  <text class="ml" x="1165" y="222" text-anchor="middle">p<tspan class="ss" dy="10">θ</tspan><tspan dy="-10">(x|z)</tspan></text>
  <path class="arr" d="M1270 208 H1316" marker-end="url(#arrow)"/>
  <!-- predicted next step -->
  <rect class="bbox" x="1320" y="120" width="200" height="176" rx="30"/>
  <text class="mx" x="1352" y="182">x</text><text class="ss" x="1369" y="168">t<tspan font-style="normal">+1</tspan></text><text class="ss" x="1369" y="191">i</text><text class="mx" x="1406" y="182">…</text>
  <text class="mx" x="1352" y="236">x</text><text class="ss" x="1369" y="222">t<tspan font-style="normal">+1</tspan></text><text class="ss" x="1369" y="245">j</text><text class="mx" x="1406" y="236">…</text>
  <text class="mx" x="1420" y="276" text-anchor="middle">··</text>
</svg>
