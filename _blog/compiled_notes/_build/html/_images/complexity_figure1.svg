<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 12 626 414" role="img" aria-labelledby="title desc">
  <title id="title">Complexity between order and disorder</title>
  <desc id="desc">Sketch with complexity on the vertical axis and a horizontal axis running from order to disorder. Complexity is low at both extremes and peaks in between.</desc>
  <!-- drawn dark-on-transparent: the notes CSS inverts images (keeping hue) for the black background -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/>
    </marker>
    <style>
      .ln { fill: none; stroke: #2b2b2b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .lbl { font-family: Helvetica, Arial, sans-serif; fill: #2b2b2b; }
      .var { font-family: Georgia, "Times New Roman", serif; font-style: italic; fill: #2b2b2b; }
    </style>
  </defs>
  <path class="ln" d="M130 382 V22" marker-end="url(#arrow)"/>
  <path class="ln" d="M130 382 H588" marker-end="url(#arrow)"/>
  <path class="ln" d="M134 378 C160 230 230 86 330 86 C430 86 495 220 560 380"/>
  <text class="lbl" x="118" y="132" text-anchor="end" font-size="24">complexity</text>
  <text class="lbl" x="130" y="416" text-anchor="middle" font-size="24">order</text>
  <text class="lbl" x="560" y="416" text-anchor="middle" font-size="24">disorder</text>
</svg>
