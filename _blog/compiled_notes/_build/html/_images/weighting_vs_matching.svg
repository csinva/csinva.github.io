<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Weighting vs matching on the propensity score</title>
  <desc id="desc">Two columns. Weighting: overlapping treatment (T=1, red) and control (T=0, blue) densities over P(T=1|X); multiplying by weights (red curve decreasing, blue increasing) gives two nearly identical densities. Matching: the same densities with vertical lines picking matched blue/red pairs in a green box; the matched pairs give two nearly identical densities.</desc>
