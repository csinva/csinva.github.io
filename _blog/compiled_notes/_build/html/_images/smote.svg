<svg xmlns="http://www.w3.org/2000/svg" viewBox="-28 6 978 380" role="img" aria-labelledby="title desc">
  <title id="title">SMOTE oversampling</title>
  <desc id="desc">Scatter of sepal width vs sepal length. Four minority-class points (dark red) are connected by line segments to their neighbors; synthetic minority instances (red) lie on these segments. Thirteen majority-class points (green) lie below.</desc>
  <!-- drawn dark-on-transparent: the notes CSS inverts images (keeping hue) for the black background -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/>
    </marker>
    <marker id="garrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f8a4c"/>
    </marker>
    <style>
