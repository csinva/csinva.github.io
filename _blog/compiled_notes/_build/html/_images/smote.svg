      .axl { font: 19px Georgia, "Times New Roman", serif; fill: #2b2b2b; text-anchor: middle; }
      .min { fill: #c4c4c4; stroke: #8b1a1a; stroke-width: 5.5; }
      .syn { fill: #c4c4c4; stroke: #d1342f; stroke-width: 3.5; }
      .maj { fill: #c4c4c4; stroke: #1f6b2e; stroke-width: 5.5; }
      .lmin { font: 22px Helvetica, Arial, sans-serif; fill: #8b1a1a; text-anchor: middle; }
      .lsyn { font: 15px Helvetica, Arial, sans-serif; fill: #d1342f; text-anchor: middle; }
      .lmaj { font: 22px Helvetica, Arial, sans-serif; fill: #1f6b2e; text-anchor: middle; }
    </style>
