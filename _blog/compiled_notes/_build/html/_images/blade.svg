  <text class="t2" x="1610" y="597" text-anchor="start"><tspan font-weight="bold">Input cols:</tspan> [<tspan style="fill:#1f8a4c">'club'</tspan>]</text>
  <text class="t2" x="1610" y="624" text-anchor="start"><tspan font-weight="bold">Output col:</tspan> none</text>
