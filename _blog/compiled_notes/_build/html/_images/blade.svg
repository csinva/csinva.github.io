  <rect x="1597" y="190" width="359" height="230" rx="10" fill="#fff" stroke="#1f6fb2" stroke-width="3"/>
  <text class="code" x="1612" y="236" text-anchor="start">df[<tspan style="fill:#1f8a4c">'rater_mean'</tspan>] =</text>
  <text class="code" x="1612" y="262" text-anchor="start">  (df[<tspan style="fill:#1f8a4c">'r1'</tspan>] + df[<tspan style="fill:#1f8a4c">'r2'</tspan>])/ 2</text>
  <text class="t2" x="1610" y="330" text-anchor="start"><tspan font-weight="bold">Verb:</tspan> derive</text>
  <text class="t2" x="1610" y="357" text-anchor="start"><tspan font-weight="bold">Input cols:</tspan> [<tspan style="fill:#1f8a4c">'r1'</tspan>, <tspan style="fill:#1f8a4c">'r2'</tspan>]</text>
