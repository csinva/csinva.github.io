<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 6 1980 962" role="img" aria-labelledby="title desc">
  <title id="title">BLADE benchmark overview</title>
  <desc id="desc">BLADE overview. (1) A research question/hypothesis (are soccer players with a dark skin tone more likely than those with a light skin tone to receive red cards from referees?) and a data table. (2) Crowd-sourced expert annotations, multi-round and LM-aided, produce (3) a ground-truth decision space: conceptual variables (DV: red cards received; IV: player skin tone; controls: player physicality, player position), statistical models (Spearman correlation, logistic regression, negative binomial regression with a log link) and data transforms (e.g. derive rater_mean from r1 and r2; groupby club; post_groupby aggregating games). (4) An LM agent with data understanding, domain knowledge and stats knowledge produces (5) a generated analysis: a DV choice, a transform function averaging rater1 and rater2 into skin_tone, and a logit model redCards ~ skin_tone + position + games. (6) Automatic evaluation converts the generated analysis, matches statistical models and conceptual variables with an LM, and matches data transformations by value and graph.</desc>
