  <rect x="80" y="520" width="688" height="57" rx="6" fill="#e07b28" stroke="none" stroke-width="0"/>
  <text class="wb" x="100" y="557" text-anchor="start">DV: Red Cards using the 'redCards' column ...</text>
  <rect x="82" y="594" width="684" height="168" rx="10" fill="#fff" stroke="#1f6fb2" stroke-width="4"/>
  <text class="code" x="97" y="630" text-anchor="start"><tspan style="fill:#1f6fb2">def</tspan> <tspan style="fill:#1f6fb2;font-weight:bold">transform</tspan>(df: pd.DataFrame) → pd.DataFrame:</text>
  <text class="code" x="97" y="657" text-anchor="start">    df[<tspan style="fill:#1f8a4c">'skin_tone'</tspan>] = df[[<tspan style="fill:#1f8a4c">'rater1'</tspan>,</text>
  <text class="code" x="97" y="684" text-anchor="start">                    <tspan style="fill:#1f8a4c">'rater2'</tspan>] ].mean(axis=1)</text>
  <text class="code" x="97" y="711" text-anchor="start">    df.dropna(subset=[<tspan style="fill:#1f8a4c">'skin_tone'</tspan>], inplace=True)</text>
  <text class="code" x="97" y="738" text-anchor="start">    <tspan style="fill:#1f6fb2">return</tspan> df</text>
  <rect x="82" y="788" width="684" height="132" rx="10" fill="#fff" stroke="#4b2a8a" stroke-width="4"/>
  <text class="code" x="97" y="822" text-anchor="start"><tspan style="fill:#1f6fb2">def</tspan> <tspan style="fill:#1f6fb2;font-weight:bold">model</tspan>(df: pd.DataFrame):</text>
  <text class="code" x="97" y="849" text-anchor="start">    formula = <tspan style="fill:#1f8a4c">'redCards ~ skin_tone + position + games'</tspan></text>
  <text class="code" x="97" y="876" text-anchor="start">    model = smf.logit(formula, data=df).fit()</text>
  <text class="code" x="97" y="903" text-anchor="start">    <tspan style="fill:#1f6fb2">return</tspan> model</text>
