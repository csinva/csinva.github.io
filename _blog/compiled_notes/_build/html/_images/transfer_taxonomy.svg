  <title id="title">Characteristics of learning paradigms</title>
  <desc id="desc">Table of learning scenarios (rows) grouped as in distribution / out of distribution and batch / streaming, versus characteristics (columns): unlabeled data, labeled data, more than one dataset, more than one task, unobserved tasks, streaming tasks, streaming priorities and resources, streaming data, computational constraints. Y: present, O: optional, n/a: not applicable.</desc>
