<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 720" role="img" aria-labelledby="title desc">
  <title id="title">RNA secondary structure elements</title>
  <desc id="desc">An RNA secondary structure drawn as a graph of nucleotides, decomposed into structural elements and colored by type: exterior loop (green, the unpaired 5' and 3' ends), stem loops (red, stacked base pairs forming helices), hairpin loops (teal, at the tips of the two side branches), a multi-loop (blue, joining the three helices), a bulge (dark red, two unpaired nucleotides on one strand of the left helix) and an interior loop (cyan, one unpaired nucleotide on each strand of the right helix). Solid lines are phospho-diester bonds along the backbone; dashed lines are hydrogen bonds between paired bases.</desc>
