      .hb { stroke: #2b2b2b; stroke-width: 3; stroke-dasharray: 6 5; }
      .leg { font: 26px Helvetica, Arial, sans-serif; fill: #2b2b2b; dominant-baseline: central; }
    </style>
  </defs>
