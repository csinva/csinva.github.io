<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1480" role="img" aria-labelledby="title desc">
  <title id="title">2-D wavelet decomposition layouts</title>
  <desc id="desc">Four 2-D coefficient layouts. wavedec2 (4 level): standard dyadic pyramid with h, v, d detail bands at the finest level, ah, av, ad at the next, and smaller nested squares. fswavedecn (4 level): fully separable decomposition, a tensor grid of rows and columns split at 1/16, 1/8, 1/4, 1/2, with blocks ('ad','ad'), ('d','ad'), ('ad','d'), ('d','d'). Wavelet packet (full: 4 level): uniform 16 by 16 grid. Wavelet packet (custom): h and d on the right half, ah, ad, vh, vd in a column, vv bottom-left, and further splits top-left.</desc>
  <!-- drawn dark-on-transparent: the notes CSS inverts images (keeping hue) for the black background -->
  <defs>
    <style>
      .ln { fill: none; stroke: #2b2b2b; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .lbl { font: 22px Helvetica, Arial, sans-serif; fill: #2b2b2b; }
      .var { font: italic 24px Georgia, "Times New Roman", serif; fill: #2b2b2b; }
      .mid { text-anchor: middle; }
      .end { text-anchor: end; }
      .g { fill: none; stroke: #2b2b2b; stroke-width: 3; stroke-linecap: square; }
      .ttl { font: 32px Helvetica, Arial, sans-serif; fill: #2b2b2b; text-anchor: middle; }
      .c { font: 26px Helvetica, Arial, sans-serif; fill: #2b2b2b; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <text class="ttl" x="315" y="40">wavedec2 (4 level)</text>
  <rect class="g" x="15" y="85" width="600" height="600"/>
  <line class="g" x1="315" y1="85" x2="315" y2="685"/>
  <line class="g" x1="15" y1="385" x2="615" y2="385"/>
  <line class="g" x1="165" y1="85" x2="165" y2="385"/>
  <line class="g" x1="15" y1="235" x2="315" y2="235"/>
  <line class="g" x1="90" y1="85" x2="90" y2="235"/>
  <line class="g" x1="15" y1="160" x2="165" y2="160"/>
  <line class="g" x1="52.5" y1="85" x2="52.5" y2="160.0"/>
  <line class="g" x1="15" y1="122.5" x2="90.0" y2="122.5"/>
  <text class="c" x="240" y="160">ah</text>
  <text class="c" x="90" y="310">av</text>
  <text class="c" x="240" y="310">ad</text>
  <text class="c" x="465" y="235">h</text>
  <text class="c" x="165" y="535">v</text>
  <text class="c" x="465" y="535">d</text>
  <text class="ttl" x="1070" y="40">fswavedecn (4 level)</text>
  <rect class="g" x="770" y="85" width="600" height="600"/>
  <line class="g" x1="1070" y1="85" x2="1070" y2="685"/>
  <line class="g" x1="770" y1="385" x2="1370" y2="385"/>
  <line class="g" x1="920" y1="85" x2="920" y2="685"/>
  <line class="g" x1="770" y1="235" x2="1370" y2="235"/>
  <line class="g" x1="845" y1="85" x2="845" y2="685"/>
  <line class="g" x1="770" y1="160" x2="1370" y2="160"/>
  <line class="g" x1="807.5" y1="85" x2="807.5" y2="685"/>
  <line class="g" x1="770" y1="122.5" x2="1370" y2="122.5"/>
  <text class="c" x="995" y="310">('ad', 'ad')</text>
  <text class="c" x="1220" y="310">('d', 'ad')</text>
  <text class="c" x="995" y="535">('ad', 'd')</text>
  <text class="c" x="1220" y="535">('d', 'd')</text>
  <text class="ttl" x="315" y="798">wavelet packet</text><text class="ttl" x="315" y="838">(full: 4 level)</text>
  <rect class="g" x="15" y="860" width="600" height="600"/>
  <line class="g" x1="52.5" y1="860" x2="52.5" y2="1460"/>
  <line class="g" x1="15" y1="897.5" x2="615" y2="897.5"/>
  <line class="g" x1="90.0" y1="860" x2="90.0" y2="1460"/>
