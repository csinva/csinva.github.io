  <line class="g" x1="15" y1="1122.5" x2="615" y2="1122.5"/>
  <line class="g" x1="315.0" y1="860" x2="315.0" y2="1460"/>
  <line class="g" x1="15" y1="1160.0" x2="615" y2="1160.0"/>
  <line class="g" x1="352.5" y1="860" x2="352.5" y2="1460"/>
