  <text class="c" x="995" y="935">ah</text>
  <text class="c" x="995" y="1085">ad</text>
  <text class="c" x="995" y="1235">vh</text>
  <text class="c" x="995" y="1385">vd</text>
  <text class="c" x="845" y="1385">vv</text>
  <text class="c" x="1220" y="1010">h</text>
  <text class="c" x="1220" y="1310">d</text>
</svg>