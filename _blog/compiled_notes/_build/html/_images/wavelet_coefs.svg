  <line class="g" x1="390.0" y1="860" x2="390.0" y2="1460"/>
  <line class="g" x1="15" y1="1235.0" x2="615" y2="1235.0"/>
  <line class="g" x1="427.5" y1="860" x2="427.5" y2="1460"/>
  <line class="g" x1="15" y1="1272.5" x2="615" y2="1272.5"/>
  <line class="g" x1="465.0" y1="860" x2="465.0" y2="1460"/>
  <line class="g" x1="15" y1="1310.0" x2="615" y2="1310.0"/>
  <line class="g" x1="502.5" y1="860" x2="502.5" y2="1460"/>
  <line class="g" x1="15" y1="1347.5" x2="615" y2="1347.5"/>
  <line class="g" x1="540.0" y1="860" x2="540.0" y2="1460"/>
  <line class="g" x1="15" y1="1385.0" x2="615" y2="1385.0"/>
  <line class="g" x1="577.5" y1="860" x2="577.5" y2="1460"/>
  <line class="g" x1="15" y1="1422.5" x2="615" y2="1422.5"/>
  <text class="ttl" x="1070" y="798">wavelet packet</text><text class="ttl" x="1070" y="838">(custom)</text>
  <rect class="g" x="770" y="860" width="600" height="600"/>
  <line class="g" x1="1070" y1="860" x2="1070" y2="1460"/>
  <line class="g" x1="920" y1="860" x2="920" y2="1460"/>
  <line class="g" x1="770" y1="1160" x2="1370" y2="1160"/>
  <line class="g" x1="770" y1="1010" x2="1070" y2="1010"/>
  <line class="g" x1="770" y1="1310" x2="1070" y2="1310"/>
