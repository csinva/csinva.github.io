<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 140" role="img" aria-labelledby="title desc">
  <title id="title">Dependency structure</title>
  <desc id="desc">Dependency parse of 'I shot an elephant in my pajamas'. Arrows point from heads to dependents: shot to I (SBJ), shot to elephant (OBJ), elephant to an (DETMOD), elephant to in (NMOD), in to pajamas (PMOD), pajamas to my (DETMOD).</desc>
  <!-- drawn dark-on-transparent: the notes CSS inverts images (keeping hue) for the black background -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/>
    </marker>
    <style>
      text { font-family: Helvetica, Arial, sans-serif; fill: #2b2b2b; }
      .c { text-anchor: middle; }
      .e { text-anchor: end; }
      .b { font-weight: bold; }
      .note { font-family: Georgia, "Times New Roman", serif; }
      .line { fill: none; stroke: #2b2b2b; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .lead { fill: none; stroke: #2b2b2b; stroke-width: 1.5; stroke-linecap: round; }
      .mid { fill: none; stroke: #2b2b2b; stroke-width: 2; stroke-dasharray: 3 5; stroke-linecap: round; }
    </style>
  </defs>
  <text class="c b" x="49" y="130.0" font-size="24">I</text>
  <text class="c b" x="144" y="130.0" font-size="24">shot</text>
  <text class="c b" x="244" y="130.0" font-size="24">an</text>
  <text class="c b" x="351" y="130.0" font-size="24">elephant</text>
  <text class="c b" x="485" y="130.0" font-size="24">in</text>
  <text class="c b" x="577" y="130.0" font-size="24">my</text>
  <text class="c b" x="676" y="130.0" font-size="24">pajamas</text>
  <path class="line" d="M140 106 V92 Q140 83 131 83 H60 Q51 83 51 92 V104" marker-end="url(#arrow)"/>
  <text class="c" x="95" y="74.0" font-size="17">SBJ</text>
  <path class="line" d="M148 106 V50 Q148 41 157 41 H343 Q352 41 352 50 V104" marker-end="url(#arrow)"/>
  <text class="c" x="249" y="32.0" font-size="17">OBJ</text>
  <path class="line" d="M317 106 V92 Q317 83 308 83 H255 Q246 83 246 92 V104" marker-end="url(#arrow)"/>
  <text class="c" x="281" y="74.0" font-size="17">DETMOD</text>
  <path class="line" d="M384 106 V92 Q384 83 393 83 H466 Q475 83 475 92 V104" marker-end="url(#arrow)"/>
  <text class="c" x="430" y="74.0" font-size="17">NMOD</text>
  <path class="line" d="M492 106 V50 Q492 41 501 41 H667 Q676 41 676 50 V104" marker-end="url(#arrow)"/>
  <text class="c" x="587" y="32.0" font-size="17">PMOD</text>
  <path class="line" d="M644 106 V92 Q644 83 635 83 H586 Q577 83 577 92 V104" marker-end="url(#arrow)"/>
  <text class="c" x="609" y="74.0" font-size="17">DETMOD</text>
</svg>
