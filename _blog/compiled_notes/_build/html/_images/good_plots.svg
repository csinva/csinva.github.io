<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 10 482 690" role="img" aria-labelledby="title desc">
  <title id="title">Bar chart types</title>
  <desc id="desc">Six small example charts with labels: vertical bar, horizontal bar, stacked vertical bar, stacked horizontal bar, waterfall, and square area (a 4x4 grid with a 2x2 block highlighted).</desc>
  <!-- drawn dark-on-transparent: the notes CSS inverts images (keeping hue) for the black background -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/>
    </marker>
    <marker id="garrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f8a4c"/>
    </marker>
    <style>
      .ax { fill: none; stroke: #8a8a8a; stroke-width: 1.5; }
      .bar { fill: #1f6fb2; }
      .gb { fill: #bdbdbd; }
      .cap { font: 20px Helvetica, Arial, sans-serif; fill: #2b2b2b; }
    </style>
  </defs>
  <!-- vertical bar -->
  <path class="ax" d="M11.0 20.0 V161.0 H198.0"/>
  <rect class="bar" x="17.0" y="98.5" width="25.0" height="62.5"/>
  <rect class="bar" x="54.5" y="82.5" width="25.0" height="78.5"/>
  <rect class="bar" x="92.0" y="98.5" width="25.0" height="62.5"/>
  <rect class="bar" x="129.5" y="114.0" width="25.0" height="47.0"/>
  <rect class="bar" x="167.0" y="35.0" width="25.0" height="126.0"/>
  <!-- horizontal bar -->
  <path class="ax" d="M263.5 21.0 V159.0"/>
  <rect class="bar" x="264.0" y="25.0" width="164.0" height="18.5"/>
  <rect class="bar" x="264.0" y="53.0" width="61.0" height="18.5"/>
  <rect class="bar" x="264.0" y="81.0" width="82.0" height="18.5"/>
  <rect class="bar" x="264.0" y="109.0" width="102.5" height="18.5"/>
  <rect class="bar" x="264.0" y="136.5" width="82.0" height="18.5"/>
  <!-- stacked vertical -->
  <path class="ax" d="M11.0 258.0 V400.0 H198.0"/>
  <rect class="gb" x="17.0" y="338.5" width="25.0" height="27.0"/>
  <rect class="bar" x="17.0" y="365.5" width="25.0" height="34.5"/>
  <rect class="gb" x="54.5" y="302.5" width="25.0" height="53.5"/>
  <rect class="bar" x="54.5" y="356.0" width="25.0" height="44.0"/>
  <rect class="gb" x="92.0" y="347.5" width="25.0" height="18.0"/>
  <rect class="bar" x="92.0" y="365.5" width="25.0" height="34.5"/>
  <rect class="gb" x="129.5" y="329.5" width="25.0" height="44.5"/>
  <rect class="bar" x="129.5" y="374.0" width="25.0" height="26.0"/>
  <rect class="gb" x="167.0" y="267.0" width="25.0" height="62.5"/>
  <rect class="bar" x="167.0" y="329.5" width="25.0" height="70.5"/>
  <!-- stacked horizontal -->
  <path class="ax" d="M263.5 260.0 V398.5"/>
  <rect class="bar" x="264.0" y="263.5" width="82.0" height="18.5"/>
  <rect class="gb" x="346.0" y="263.5" width="72.0" height="18.5"/>
  <rect class="bar" x="264.0" y="292.0" width="30.5" height="18.5"/>
  <rect class="gb" x="294.5" y="292.0" width="51.5" height="18.5"/>
  <rect class="bar" x="264.0" y="320.0" width="41.0" height="18.5"/>
  <rect class="gb" x="305.0" y="320.0" width="20.5" height="18.5"/>
  <rect class="bar" x="264.0" y="348.0" width="51.0" height="18.5"/>
  <rect class="gb" x="315.0" y="348.0" width="62.0" height="18.5"/>
  <rect class="bar" x="264.0" y="376.0" width="41.0" height="18.5"/>
  <rect class="gb" x="305.0" y="376.0" width="31.0" height="18.5"/>
  <!-- waterfall -->
  <path class="ax" d="M11.0 500.0 V641.5 H198.0"/>
  <rect class="bar" x="16.0" y="553.5" width="20.5" height="88.0"/>
  <rect class="bar" x="47.0" y="527.0" width="21.0" height="26.5"/>
  <rect class="bar" x="78.5" y="520.0" width="20.5" height="7.0"/>
  <rect class="bar" x="110.0" y="520.0" width="20.5" height="10.5"/>
  <rect class="bar" x="141.0" y="530.5" width="20.5" height="8.5"/>
  <rect class="bar" x="172.5" y="539.0" width="20.5" height="102.5"/>
  <!-- square area -->
  <rect class="gb" x="259.50" y="476.50" width="42.75" height="43.62"/>
  <rect class="gb" x="303.25" y="476.50" width="42.75" height="43.62"/>
  <rect class="gb" x="347.00" y="476.50" width="42.75" height="43.62"/>
  <rect class="gb" x="390.75" y="476.50" width="42.75" height="43.62"/>
  <rect class="gb" x="259.50" y="521.12" width="42.75" height="43.62"/>
  <rect class="gb" x="303.25" y="521.12" width="42.75" height="43.62"/>
  <rect class="gb" x="347.00" y="521.12" width="42.75" height="43.62"/>
  <rect class="gb" x="390.75" y="521.12" width="42.75" height="43.62"/>
  <rect class="gb" x="259.50" y="565.75" width="42.75" height="43.62"/>
  <rect class="gb" x="303.25" y="565.75" width="42.75" height="43.62"/>
  <rect class="bar" x="347.00" y="565.75" width="42.75" height="43.62"/>
  <rect class="bar" x="390.75" y="565.75" width="42.75" height="43.62"/>
  <rect class="gb" x="259.50" y="610.38" width="42.75" height="43.62"/>
  <rect class="gb" x="303.25" y="610.38" width="42.75" height="43.62"/>
  <rect class="bar" x="347.00" y="610.38" width="42.75" height="43.62"/>
  <rect class="bar" x="390.75" y="610.38" width="42.75" height="43.62"/>
  <text class="cap" x="10.0" y="196.0">Vertical bar</text>
  <text class="cap" x="263.5" y="196.0">Horizontal bar</text>
  <text class="cap" x="10.0" y="435.5">Stacked vertical bar</text>
  <text class="cap" x="257.0" y="435.5">Stacked horizontal bar</text>
  <text class="cap" x="10.0" y="675.0">Waterfall</text>
  <text class="cap" x="263.5" y="683.0">Square area</text>
</svg>
