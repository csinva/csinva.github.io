  <rect class="co" x="581" y="123.6" width="96" height="22.7"/>
  <rect class="co" x="581" y="145.9" width="370" height="22.7"/>
  <rect class="co" x="581" y="168.2" width="580" height="22.7"/>
  <rect class="co" x="581" y="190.5" width="276" height="22.7"/>
  <text class="rank" x="1247" y="99">1 of 6</text>
  <text class="cat" x="549" y="155.9">Price</text>
