<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 14 1450 870" role="img" aria-labelledby="title desc">
  <title id="title">Using contrast strategically</title>
  <desc id="desc">Grouped horizontal bars of a weighted performance index for price, convenience, relationship, service and selection. In each group our business is the top bar in blue, labeled with its relative rank (1, 2, 4, 6 and 6 of 6), and competitors A to E are gray bars below it.</desc>
  <!-- drawn dark-on-transparent: the notes CSS inverts images (keeping hue) for the black background -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/>
    </marker>
    <marker id="garrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f8a4c"/>
    </marker>
    <style>
      .us { fill: #1f6fb2; }
      .co { fill: #b5b5b5; }
      .cat { font: 30px Helvetica, Arial, sans-serif; fill: #2b2b2b; text-anchor: end; }
      .leg { font: 26px Helvetica, Arial, sans-serif; fill: #9a9a9a; }
      .rank { font: 22px Helvetica, Arial, sans-serif; fill: #1f6fb2; }
      .hd { font: 26px Helvetica, Arial, sans-serif; fill: #8a8a8a; }
    </style>
  </defs>
  <text class="hd" x="582" y="52">Weighted performance index | <tspan fill="#1f6fb2" style="fill:#1f6fb2">relative rank</tspan></text>
