  <text class="leg" x="52" y="50" font-weight="bold" style="fill:#1f6fb2">Our business</text>
  <rect x="24" y="77.0" width="20" height="20" class="co"/>
  <text class="leg" x="52" y="96.0">Competitor A</text>
  <rect x="24" y="123.2" width="20" height="20" class="co"/>
  <text class="leg" x="52" y="142.2">Competitor B</text>
  <rect x="24" y="169.4" width="20" height="20" class="co"/>
  <text class="leg" x="52" y="188.4">Competitor C</text>
  <rect x="24" y="215.6" width="20" height="20" class="co"/>
  <text class="leg" x="52" y="234.6">Competitor D</text>
  <rect x="24" y="261.8" width="20" height="20" class="co"/>
  <text class="leg" x="52" y="280.8">Competitor E</text>
