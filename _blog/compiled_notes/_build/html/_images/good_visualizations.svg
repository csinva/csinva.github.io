<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 10 482 680" role="img" aria-labelledby="title desc">
  <title id="title">Common visual types</title>
  <desc id="desc">Six example visuals with labels: simple text (a large 91%), scatterplot, table of percentages for categories 1-6 by columns A-C, line chart, heatmap (the same table shaded by value), and slopegraph.</desc>
  <!-- drawn dark-on-transparent: the notes CSS inverts images (keeping hue) for the black background -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/>
    </marker>
    <marker id="garrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f8a4c"/>
    </marker>
    <style>
      .ax { fill: none; stroke: #8a8a8a; stroke-width: 1.5; }
      .bar { fill: #1f6fb2; }
      .gb { fill: #bdbdbd; }
      .cap { font: 20px Helvetica, Arial, sans-serif; fill: #2b2b2b; }
      .big { font: bold 96px Helvetica, Arial, sans-serif; fill: #1f6fb2; }
      .ln { fill: none; stroke: #1f6fb2; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
      .grid { stroke: #bdbdbd; stroke-width: 1; }
      .td { font: 14px Helvetica, Arial, sans-serif; fill: #2b2b2b; text-anchor: middle; }
      .th { font: 14px Helvetica, Arial, sans-serif; fill: #2b2b2b; }
      .fig { font: 14px Helvetica, Arial, sans-serif; fill: #8a8a8a; }
    </style>
  </defs>
  <text class="big" x="8" y="122.0">91%</text>
