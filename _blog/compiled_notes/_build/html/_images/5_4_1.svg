<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
  <title id="title">The cable equation</title>
  <desc id="desc">Before we had: i_m = i_C + i_ionic = c_m dV_m/dt + V_m/r_m. A cable diagram shows a cylinder of radius a with repeated membrane units (resistance r_m in parallel with capacitance c_m, membrane current i_m) between an outer resistance r_o and an internal resistance r_i carrying axial current i_i along x. Now we also have to consider that i_i, the current down the cable, is proportional to voltage changes in x; that current works against internal resistance r_i. Cable equation: (1/r_i) d2V_m(x,t)/dx2 = c_m dV/dt + V_m/r_m, or lambda^2 d2V_m/dx2 = tau_m dV_m/dt + V_m, where tau_m = r_m c_m is the time constant and lambda = sqrt(r_m/r_i) is the space constant.</desc>
  <!-- drawn dark-on-transparent: the notes CSS inverts images (keeping hue) for the black background -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/></marker>
    <style>
      .w path, .w ellipse { fill: none; stroke: #2b2b2b; stroke-width: 1.8; stroke-linejoin: round; }
      .ar { fill: none; stroke: #2b2b2b; stroke-width: 2; }
      .fl { stroke: #2b2b2b; stroke-width: 2; }
      .d { font: italic 20px Georgia, "Times New Roman", serif; fill: #2b2b2b; }
      .s2 { font-size: 14px; }
      .m { font: 30px Georgia, "Times New Roman", serif; fill: #2b2b2b; }
      .s { font-size: 20px; }
      .t { font: 30px Helvetica, Arial, sans-serif; fill: #2b2b2b; }
    </style>
  </defs>
  <g class="w">
