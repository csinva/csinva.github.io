  <path d="M560 40 L564.8 35 L574.5 45 L584.1 35 L593.8 45 L603.5 35 L613.1 45 L622.8 35 L632.4 45 L642.1 35 L651.8 45 L661.4 35 L671.1 45 L680.7 35 L690.4 45 L700.1 35 L709.7 45 L719.4 35 L729.0 45 L738.7 35 L748.4 45 L758.0 35 L767.7 45 L777.3 35 L787.0 45 L796.6 35 L806.3 45 L816.0 35 L825.6 45 L835.3 35 L844.9 45 L854.6 35 L864.3 45 L873.9 35 L883.6 45 L893.2 35 L902.9 45 L912.6 35 L922.2 45 L931.9 35 L941.5 45 L951.2 35 L960.9 45 L970.5 35 L980.2 45 L985 40"/>
  <path d="M560 160 L564.8 155 L574.5 165 L584.1 155 L593.8 165 L603.5 155 L613.1 165 L622.8 155 L632.4 165 L642.1 155 L651.8 165 L661.4 155 L671.1 165 L680.7 155 L690.4 165 L700.1 155 L709.7 165 L719.4 155 L729.0 165 L738.7 155 L748.4 165 L758.0 155 L767.7 165 L777.3 155 L787.0 165 L796.6 155 L806.3 165 L816.0 155 L825.6 165 L835.3 155 L844.9 165 L854.6 155 L864.3 165 L873.9 155 L883.6 165 L893.2 155 L902.9 165 L912.6 155 L922.2 165 L931.9 155 L941.5 165 L951.2 155 L960.9 165 L970.5 155 L980.2 165 L985 160"/>
  <path d="M600 40 V54  L593 59.8 L607 71.2 L593 82.8 L607 94.2 L593 105.8 L607 117.2 L593 128.8 L607 140.2 L600 146 V160"/>
  <path d="M600 54 H630 V92 M618 92 H642 M618 102 H642 M630 102 V146 H600 M600 54"/>
  <path d="M680 40 V54  L673 59.8 L687 71.2 L673 82.8 L687 94.2 L673 105.8 L687 117.2 L673 128.8 L687 140.2 L680 146 V160"/>
  <path d="M680 54 H710 V92 M698 92 H722 M698 102 H722 M710 102 V146 H680 M680 54"/>
  <path d="M760 40 V54  L753 59.8 L767 71.2 L753 82.8 L767 94.2 L753 105.8 L767 117.2 L753 128.8 L767 140.2 L760 146 V160"/>
  <path d="M760 54 H790 V92 M778 92 H802 M778 102 H802 M790 102 V146 H760 M760 54"/>
  <path d="M840 40 V54  L833 59.8 L847 71.2 L833 82.8 L847 94.2 L833 105.8 L847 117.2 L833 128.8 L847 140.2 L840 146 V160"/>
  <path d="M840 54 H870 V92 M858 92 H882 M858 102 H882 M870 102 V146 H840 M840 54"/>
