  </g>
  <path class="ar" d="M548 155 V104" marker-end="url(#a)"/><text class="d" x="534" y="140">a</text>
  <text class="d" x="572" y="66">r<tspan class="s2" dy="5">m</tspan></text>
  <text class="d" x="636" y="70">c<tspan class="s2" dy="5">m</tspan></text>
  <path class="ar" d="M590 140 V112" marker-end="url(#a)"/><text class="d" x="562" y="130">i<tspan class="s2" dy="5">m</tspan></text>
  <text class="d" x="770" y="22">r<tspan class="s2" dy="5">o</tspan></text>
  <text class="d" x="770" y="190">r<tspan class="s2" dy="5">i</tspan></text>
  <path class="ar" d="M590 182 H650" marker-end="url(#a)"/><text class="d" x="606" y="204">i<tspan class="s2" dy="5">i</tspan></text>
  <path class="ar" d="M700 236 H830" marker-end="url(#a)"/><text class="d" x="760" y="262">x</text>
  <text class="t" x="40" y="86">Before we had:</text>
  <text class="m" x="30" y="190"><tspan font-style="italic">i</tspan><tspan class="s" dy="7"><tspan font-style="italic">m</tspan></tspan><tspan dy="-7"></tspan> = <tspan font-style="italic">i</tspan><tspan class="s" dy="7"><tspan font-style="italic">C</tspan></tspan><tspan dy="-7"></tspan> + <tspan font-style="italic">i</tspan><tspan class="s" dy="7">ionic</tspan><tspan dy="-7"> = </tspan><tspan font-style="italic">c</tspan><tspan class="s" dy="7"><tspan font-style="italic">m</tspan></tspan><tspan dy="-7"></tspan></text>
  <text class="m" x="322" y="168" text-anchor="middle">∂<tspan font-style="italic">V</tspan><tspan class="s" dy="7"><tspan font-style="italic">m</tspan></tspan><tspan dy="-7"></tspan></text>
  <line x1="287.0" y1="180" x2="357.0" y2="180" class="fl"/>
  <text class="m" x="322" y="212" text-anchor="middle">∂<tspan font-style="italic">t</tspan></text>
  <text class="m" x="364" y="190">+</text>
  <text class="m" x="412" y="168" text-anchor="middle"><tspan font-style="italic">V</tspan><tspan class="s" dy="7"><tspan font-style="italic">m</tspan></tspan><tspan dy="-7"></tspan></text>
  <line x1="387.0" y1="180" x2="437.0" y2="180" class="fl"/>
  <text class="m" x="412" y="212" text-anchor="middle"><tspan font-style="italic">r</tspan><tspan class="s" dy="7"><tspan font-style="italic">m</tspan></tspan><tspan dy="-7"></tspan></text>
  <text class="t" x="20" y="320">Now we also have to consider that i<tspan class="s" dy="7">i</tspan><tspan dy="-7">, the current down the cable,</tspan></text>
  <text class="t" x="20" y="358">is proportional to voltage changes in <tspan font-style="italic">x</tspan>.</text>
  <text class="t" x="20" y="396">That current works against internal resistance, r<tspan class="s" dy="7">i</tspan></text>
  <rect x="30" y="430" width="460" height="118" fill="none" stroke="#d1342f" stroke-width="3"/>
  <text class="m" x="66" y="478" text-anchor="middle">1</text>
  <line x1="53.0" y1="490" x2="79.0" y2="490" class="fl"/>
  <text class="m" x="66" y="522" text-anchor="middle"><tspan font-style="italic">r</tspan><tspan class="s" dy="7"><tspan font-style="italic">i</tspan></tspan><tspan dy="-7"></tspan></text>
  <text class="m" x="178" y="478" text-anchor="middle">∂<tspan class="s" dy="-13">2</tspan><tspan dy="13"></tspan><tspan font-style="italic">V</tspan><tspan class="s" dy="7"><tspan font-style="italic">m</tspan></tspan><tspan dy="-7"></tspan>(<tspan font-style="italic">x</tspan>, <tspan font-style="italic">t</tspan>)</text>
  <line x1="103.0" y1="490" x2="253.0" y2="490" class="fl"/>
  <text class="m" x="178" y="522" text-anchor="middle">∂<tspan font-style="italic">x</tspan><tspan class="s" dy="-13">2</tspan><tspan dy="13"></tspan></text>
  <text class="m" x="262" y="500">= <tspan font-style="italic">c</tspan><tspan class="s" dy="7"><tspan font-style="italic">m</tspan></tspan><tspan dy="-7"></tspan></text>
  <text class="m" x="362" y="478" text-anchor="middle">∂<tspan font-style="italic">V</tspan></text>
  <line x1="337.0" y1="490" x2="387.0" y2="490" class="fl"/>
  <text class="m" x="362" y="522" text-anchor="middle">∂<tspan font-style="italic">t</tspan></text>
  <text class="m" x="394" y="500">+</text>
  <text class="m" x="440" y="478" text-anchor="middle"><tspan font-style="italic">V</tspan><tspan class="s" dy="7"><tspan font-style="italic">m</tspan></tspan><tspan dy="-7"></tspan></text>
  <line x1="417.0" y1="490" x2="463.0" y2="490" class="fl"/>
  <text class="m" x="440" y="522" text-anchor="middle"><tspan font-style="italic">r</tspan><tspan class="s" dy="7"><tspan font-style="italic">m</tspan></tspan><tspan dy="-7"></tspan></text>
  <text class="m" x="466" y="500">.</text>
  <text class="t" x="516" y="500">or</text>
  <rect x="566" y="430" width="420" height="118" fill="none" stroke="#1f8a4c" stroke-width="3"/>
  <text class="m" x="582" y="500"><tspan font-style="italic">λ</tspan><tspan class="s" dy="-13">2</tspan><tspan dy="13"></tspan></text>
  <text class="m" x="668" y="478" text-anchor="middle">∂<tspan class="s" dy="-13">2</tspan><tspan dy="13"></tspan><tspan font-style="italic">V</tspan><tspan class="s" dy="7"><tspan font-style="italic">m</tspan></tspan><tspan dy="-7"></tspan></text>
  <line x1="630.0" y1="490" x2="706.0" y2="490" class="fl"/>
  <text class="m" x="668" y="522" text-anchor="middle">∂<tspan font-style="italic">x</tspan><tspan class="s" dy="-13">2</tspan><tspan dy="13"></tspan></text>
  <text class="m" x="716" y="500">= <tspan font-style="italic">τ</tspan><tspan class="s" dy="7"><tspan font-style="italic">m</tspan></tspan><tspan dy="-7"></tspan></text>
  <text class="m" x="822" y="478" text-anchor="middle">∂<tspan font-style="italic">V</tspan><tspan class="s" dy="7"><tspan font-style="italic">m</tspan></tspan><tspan dy="-7"></tspan></text>
  <line x1="787.0" y1="490" x2="857.0" y2="490" class="fl"/>
  <text class="m" x="822" y="522" text-anchor="middle">∂<tspan font-style="italic">t</tspan></text>
  <text class="m" x="866" y="500">+ <tspan font-style="italic">V</tspan><tspan class="s" dy="7"><tspan font-style="italic">m</tspan></tspan><tspan dy="-7"></tspan></text>
  <text class="t" x="330" y="640">where</text>
  <text class="m" x="470" y="596"><tspan font-style="italic">τ</tspan><tspan class="s" dy="7"><tspan font-style="italic">m</tspan></tspan><tspan dy="-7"></tspan> = <tspan font-style="italic">r</tspan><tspan class="s" dy="7"><tspan font-style="italic">m</tspan></tspan><tspan dy="-7"></tspan><tspan font-style="italic">c</tspan><tspan class="s" dy="7"><tspan font-style="italic">m</tspan></tspan><tspan dy="-7"></tspan></text>
  <text class="t" x="700" y="596">Time constant</text>
  <text class="m" x="470" y="678"><tspan font-style="italic">λ</tspan> =</text>
  <path class="fl" style="fill:none" d="M518 676 L526 672 L536 700 L550 626 H600"/>
  <text class="m" x="574" y="656" text-anchor="middle"><tspan font-style="italic">r</tspan><tspan class="s" dy="7"><tspan font-style="italic">m</tspan></tspan><tspan dy="-7"></tspan></text>
  <line x1="552.0" y1="668" x2="596.0" y2="668" class="fl"/>
  <text class="m" x="574" y="700" text-anchor="middle"><tspan font-style="italic">r</tspan><tspan class="s" dy="7"><tspan font-style="italic">i</tspan></tspan><tspan dy="-7"></tspan></text>
  <text class="t" x="700" y="678">Space constant</text>
</svg>
