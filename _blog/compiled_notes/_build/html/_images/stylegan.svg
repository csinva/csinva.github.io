<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 20 1975 1700" role="img" aria-labelledby="title desc">
  <title id="title">StyleGAN generator</title>
  <desc id="desc">(a) Traditional generator: latent z ∈ 𝒵 is normalized and fed to the first layer; each resolution block (4×4, 8×8, ...) stacks fully-connected or upsample, conv 3×3 and PixelNorm layers. (b) Style-based generator: a mapping network f (normalize then 8 FC layers) maps z to w ∈ 𝒲. The synthesis network g starts from a learned constant 4×4×512; at each block, per-layer noise is scaled by B and added (⊕), then AdaIN applies a style computed from w by an affine transform A; conv 3×3 and upsample layers between them, blocks at 4×4, 8×8, ...</desc>
  <!-- drawn dark-on-transparent: the notes CSS inverts images (keeping hue) for the black background -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 L3 5 z" fill="#2b2b2b"/></marker>
    <style>
      .bg { fill: #8a8a8a; fill-opacity: 0.1; stroke: #8a8a8a; stroke-width: 3; }
      .gray { fill: #8a8a8a; fill-opacity: 0.3; stroke: #2b2b2b; stroke-width: 3; }
      .grn { fill: #1f8a4c; fill-opacity: 0.18; stroke: #2b2b2b; stroke-width: 3; }
      .blu { fill: #1f6fb2; fill-opacity: 0.22; stroke: #2b2b2b; stroke-width: 3; }
      .pl { fill: none; stroke: #2b2b2b; stroke-width: 3; }
      .cloud { fill: none; stroke: #2b2b2b; stroke-width: 3; stroke-linejoin: round; }
      .e { fill: none; stroke: #2b2b2b; stroke-width: 3.5; stroke-linejoin: round; }
      .bl { font: 46px Helvetica, Arial, sans-serif; fill: #2b2b2b; text-anchor: middle; dominant-baseline: central; }
      .lab { font: 54px Helvetica, Arial, sans-serif; fill: #2b2b2b; }
      .sm { font: 44px Helvetica, Arial, sans-serif; fill: #2b2b2b; }
      .cap { font: 56px Helvetica, Arial, sans-serif; fill: #2b2b2b; }
      .bm { font-family: Georgia, "Times New Roman", serif; font-weight: bold; }
      .it { font-family: Georgia, "Times New Roman", serif; font-style: italic; }
      .cal { font-family: Georgia, "Times New Roman", serif; font-style: italic; }
    </style>
  </defs>
<text class="lab" x="268" y="95" text-anchor="middle">Latent <tspan class="bm">z</tspan> ∈ <tspan class="cal">𝒵</tspan></text>
