<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 210 1000 270" role="img" aria-labelledby="title desc">
  <title id="title">Adaptive representation of information</title>
  <desc id="desc">A stimulus s(t), drawn as a high-variance red trace overlaid on a low-variance blue trace, passes through a linear feature filter f1 and then an input/output function (a sigmoid from 0 to 1) to produce a spike train r(t). Double arrows under the sigmoid compare input ranges: purple spans the sigmoid's rising part, red a much wider range, green a narrow range.</desc>
  <!-- drawn dark-on-transparent: the notes CSS inverts images (keeping hue) for the black background -->
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#d1342f" stroke-width="2"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#7b4fb5" stroke-width="2"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#1f8a4c" stroke-width="2"/></marker>
    <style>
      .ln { fill: none; stroke-linejoin: round; stroke-linecap: round; }
      .t { font: 22px Helvetica, Arial, sans-serif; fill: #2b2b2b; text-anchor: middle; }
      .v { font: italic 22px Georgia, "Times New Roman", serif; fill: #2b2b2b; }
    </style>
  </defs>

