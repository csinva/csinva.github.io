<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1337 1167" role="img" aria-labelledby="title desc">
  <title id="title">Taxonomy of variable importance measures (VIMs)</title>
  <desc id="desc">Tree of VIM families: difference-based VIMs; parametric regression techniques (linear regression, rank regression, polynomial regression); nonparametric regression techniques (LOESS, GAM, projection pursuit, random forest); hypothesis test techniques (grid-based tests and tests without use of grid); variance-based VIMs; moment-independent VIMs; graphic VIMs. Blue notes add short explanations.</desc>
