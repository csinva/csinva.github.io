<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 8 756 568" role="img" aria-labelledby="title desc">
  <title id="title">Spatiotemporal coverage of neuroscience methods</title>
  <desc id="desc">Chart of log spatial scale (mm, from synapse to whole brain) versus log temporal resolution (sec, from millisecond to day) covered by each method: MEG and ERP, optical dyes, TMS, functional MRI, PET, lesions, microlesions, 2-deoxyglucose, multi-unit recording, single unit, patch clamp and light microscopy. Each method is a rounded outline spanning its range.</desc>
  <!-- drawn dark-on-transparent: the notes CSS inverts images (keeping hue) for the black background -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/>
    </marker>
    <style>
      .frame { fill: none; stroke: #2b2b2b; stroke-width: 2; }
      .ax { fill: none; stroke: #2b2b2b; stroke-width: 2.5; }
      .ld { fill: none; stroke: #2b2b2b; stroke-width: 1.5; }
      .tk { font: 18px Helvetica, Arial, sans-serif; fill: #2b2b2b; }
      .cat { font: 18px Helvetica, Arial, sans-serif; fill: #2b2b2b; }
      .lab { font: 18px Helvetica, Arial, sans-serif; fill: #2b2b2b; }
      .ttl { font: bold 19px Helvetica, Arial, sans-serif; fill: #2b2b2b; }
    </style>
  </defs>
  <!-- MEG & ERP --><rect x="165.6" y="81.6" width="205.6" height="73.2" rx="24.0" fill="none" stroke="#d1342f" stroke-width="12" stroke-opacity="0.72"/>
  <!-- Optical dyes --><rect x="205.8" y="118.4" width="140.8" height="175.7" rx="24.0" fill="none" stroke="#1f6fb2" stroke-width="12" stroke-opacity="0.72"/>
  <!-- TMS --><rect x="310.8" y="108.7" width="90.5" height="82.9" rx="24.0" fill="none" stroke="#1f8a4c" stroke-width="12" stroke-opacity="0.72"/>
  <!-- Functional MRI --><rect x="393.2" y="84.2" width="143.3" height="115.0" rx="24.0" fill="none" stroke="#d9822b" stroke-width="12" stroke-opacity="0.72"/>
  <!-- PET --><rect x="438.5" y="86.2" width="195.5" height="112.9" rx="24.0" fill="none" stroke="#8e5f6e" stroke-width="12" stroke-opacity="0.72"/>
  <!-- Lesions --><rect x="643.5" y="98.5" width="83.0" height="88.0" rx="24.0" fill="none" stroke="#d6b21e" stroke-width="12" stroke-opacity="0.72"/>
  <!-- Microlesions --><rect x="556.1" y="199.0" width="167.4" height="29.2" rx="14.6" fill="none" stroke="#4f9e3a" stroke-width="8" stroke-opacity="0.72"/>
  <!-- 2-Deoxyglucose --><rect x="486.2" y="88.3" width="59.9" height="188.4" rx="24.0" fill="none" stroke="#7b4fb5" stroke-width="12" stroke-opacity="0.72"/>
  <!-- Multi-unit recording --><rect x="153.5" y="220.9" width="230.2" height="85.9" rx="24.0" fill="none" stroke="#5a5a5a" stroke-width="12" stroke-opacity="0.72"/>
  <!-- Light microscopy --><rect x="373.6" y="278.5" width="165.4" height="120.6" rx="24.0" fill="none" stroke="#1f6fb2" stroke-width="12" stroke-opacity="0.72"/>
  <!-- Single unit --><rect x="166.6" y="311.7" width="454.3" height="29.2" rx="14.6" fill="none" stroke="#d9603b" stroke-width="8" stroke-opacity="0.72"/>
  <!-- Patch clamp --><rect x="166.6" y="348.9" width="289.5" height="22.1" rx="11.0" fill="none" stroke="#9b59b6" stroke-width="8" stroke-opacity="0.72"/>
  <rect class="frame" x="139.0" y="17.5" width="602.5" height="460.0"/>
  <path class="ax" d="M139.0 69.0 h10"/><text class="tk" x="129.0" y="76.0" text-anchor="end">3</text><path class="ax" d="M139.0 120.0 h10"/><text class="tk" x="129.0" y="127.0" text-anchor="end">2</text><path class="ax" d="M139.0 171.0 h10"/><text class="tk" x="129.0" y="178.0" text-anchor="end">1</text><path class="ax" d="M139.0 222.0 h10"/><text class="tk" x="129.0" y="229.0" text-anchor="end">0</text><path class="ax" d="M139.0 273.0 h10"/><text class="tk" x="129.0" y="280.0" text-anchor="end">−1</text><path class="ax" d="M139.0 324.0 h10"/><text class="tk" x="129.0" y="331.0" text-anchor="end">−2</text><path class="ax" d="M139.0 375.0 h10"/><text class="tk" x="129.0" y="382.0" text-anchor="end">−3</text><path class="ax" d="M139.0 426.0 h10"/><text class="tk" x="129.0" y="433.0" text-anchor="end">−4</text>
  <path class="ax" d="M188.2 477.5 v-10"/><text class="tk" x="188.2" y="501.5" text-anchor="middle">−3</text><path class="ax" d="M238.5 477.5 v-10"/><text class="tk" x="238.5" y="501.5" text-anchor="middle">−2</text><path class="ax" d="M288.8 477.5 v-10"/><text class="tk" x="288.8" y="501.5" text-anchor="middle">−1</text><path class="ax" d="M339.0 477.5 v-10"/><text class="tk" x="339.0" y="501.5" text-anchor="middle">0</text><path class="ax" d="M389.2 477.5 v-10"/><text class="tk" x="389.2" y="501.5" text-anchor="middle">1</text><path class="ax" d="M439.5 477.5 v-10"/><text class="tk" x="439.5" y="501.5" text-anchor="middle">2</text><path class="ax" d="M489.8 477.5 v-10"/><text class="tk" x="489.8" y="501.5" text-anchor="middle">3</text><path class="ax" d="M540.0 477.5 v-10"/><text class="tk" x="540.0" y="501.5" text-anchor="middle">4</text><path class="ax" d="M590.2 477.5 v-10"/><text class="tk" x="590.2" y="501.5" text-anchor="middle">5</text><path class="ax" d="M640.5 477.5 v-10"/><text class="tk" x="640.5" y="501.5" text-anchor="middle">6</text><path class="ax" d="M690.8 477.5 v-10"/><text class="tk" x="690.8" y="501.5" text-anchor="middle">7</text>
  <text class="cat" x="30" y="97.5">Brain</text><text class="cat" x="30" y="173.5">Map</text><text class="cat" x="30" y="228.5">Column</text><text class="cat" x="30" y="281.0">Layer</text><text class="cat" x="30" y="310.5">Neuron</text><text class="cat" x="30" y="361.0">Dendrite</text><text class="cat" x="30" y="423.5">Synapse</text>
  <text class="cat" x="189.0" y="527.5" text-anchor="middle">Millisecond</text><text class="cat" x="339.0" y="527.5" text-anchor="middle">Second</text><text class="cat" x="444.0" y="527.5" text-anchor="middle">Minute</text><text class="cat" x="510.0" y="527.5" text-anchor="middle">Hour</text><text class="cat" x="590.0" y="527.5" text-anchor="middle">Day</text>
  <text class="lab" x="209.0" y="50.0" text-anchor="middle">MEG &amp; ERP</text>
  <path class="ld" d="M206.0 56.0 L196.5 112.5"/>
  <text class="lab" x="389.0" y="50.0" text-anchor="middle">Functional MRI</text>
  <path class="ld" d="M375.0 59.0 L415.0 106.0"/>
  <text class="lab" x="372.5" y="180.0" text-anchor="middle">TMS</text>
  <text class="lab" x="261.0" y="198.0" text-anchor="middle">Optical dyes</text>
  <text class="lab" x="583.0" y="147.0" text-anchor="middle">PET</text>
  <text class="lab" x="681.0" y="147.0" text-anchor="middle">Lesions</text>
  <text class="lab" x="661.0" y="217.0" text-anchor="middle">Microlesions</text>
  <text class="lab" x="271.0" y="252.0" text-anchor="middle">Multi-unit</text>
  <text class="lab" x="271.0" y="270.0" text-anchor="middle">recording</text>
  <text class="lab" x="562.5" y="275.0" text-anchor="start">2-Deoxyglucose</text>
  <path class="ld" d="M556.0 267.5 L517.5 250.0"/>
  <text class="lab" x="191.5" y="402.0" text-anchor="middle">Single unit</text>
  <path class="ld" d="M197.5 387.5 L265.0 325.0"/>
  <text class="lab" x="326.0" y="417.0" text-anchor="middle">Patch clamp</text>
  <path class="ld" d="M320.0 402.5 L295.0 360.0"/>
  <text class="lab" x="564.0" y="412.0" text-anchor="start">Light microscopy</text>
  <path class="ld" d="M559.0 404.0 L489.0 366.5"/>
  <text class="ttl" x="440.2" y="559.5" text-anchor="middle">Log time (sec)</text>
  <text class="ttl" transform="translate(14 247.5) rotate(-90)" text-anchor="middle">Log size (mm)</text>
</svg>
