<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 8 862 520" role="img" aria-labelledby="title desc">
  <title id="title">100% stacked horizontal bar chart</title>
  <desc id="desc">Survey results: 100% stacked horizontal bars for survey items A to E, split into strongly disagree, disagree (dark gray), neutral (light gray), agree, strongly agree (blue), with a percent-of-total axis from 0% to 100%.</desc>
  <!-- drawn dark-on-transparent: the notes CSS inverts images (keeping hue) for the black background -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/>
    </marker>
    <marker id="garrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f8a4c"/>
    </marker>
    <style>
      .sd { fill: #5a5a5a; }
      .nu { fill: #c0c0c0; }
      .ag { fill: #1f4f8a; }
      .ax { fill: none; stroke: #8a8a8a; stroke-width: 1.5; }
      .title { font: 26px Helvetica, Arial, sans-serif; fill: #2b2b2b; }
      .lab { font: 19px Helvetica, Arial, sans-serif; fill: #2b2b2b; }
      .tick { font: 19px Helvetica, Arial, sans-serif; fill: #5a5a5a; text-anchor: middle; }
      .leg { font: bold 19px Helvetica, Arial, sans-serif; }
    </style>
  </defs>
  <text class="title" x="22" y="40">Survey results</text>
  <text class="leg" x="152" y="80"><tspan fill="#5a5a5a">Strongly Disagree</tspan><tspan fill="#8a8a8a" font-weight="normal"> | </tspan><tspan fill="#5a5a5a">Disagree</tspan><tspan fill="#8a8a8a" font-weight="normal"> | Neutral | </tspan><tspan fill="#1f4f8a">Agree</tspan><tspan fill="#8a8a8a" font-weight="normal"> | </tspan><tspan fill="#1f4f8a">Strongly Agree</tspan></text>
  <text class="lab" x="155" y="120" fill="#5a5a5a" style="fill:#5a5a5a">Percent of total</text>
  <text class="tick" x="172.0" y="148">0%</text>
  <text class="tick" x="305.0" y="148">20%</text>
  <text class="tick" x="438.0" y="148">40%</text>
  <text class="tick" x="571.0" y="148">60%</text>
  <text class="tick" x="704.0" y="148">80%</text>
  <text class="tick" x="837.0" y="148">100%</text>
  <path class="ax" d="M172 160 H837"/>
  <path class="ax" d="M172.0 156 V160"/>
  <path class="ax" d="M305.0 156 V160"/>
  <path class="ax" d="M438.0 156 V160"/>
  <path class="ax" d="M571.0 156 V160"/>
  <path class="ax" d="M704.0 156 V160"/>
  <path class="ax" d="M837.0 156 V160"/>
  <rect class="sd" x="173.0" y="176" width="31.2" height="43"/>
  <rect class="sd" x="206.2" y="176" width="31.2" height="43"/>
  <rect class="nu" x="239.5" y="176" width="197.5" height="43"/>
  <rect class="ag" x="439.0" y="176" width="177.6" height="43"/>
  <rect class="ag" x="618.5" y="176" width="217.4" height="43"/>
  <text class="lab" x="162" y="204" text-anchor="end">Survey item A</text>
  <rect class="sd" x="173.0" y="242" width="37.9" height="43"/>
  <rect class="sd" x="212.9" y="242" width="71.2" height="43"/>
  <rect class="nu" x="286.1" y="242" width="230.8" height="43"/>
  <rect class="ag" x="518.8" y="242" width="184.2" height="43"/>
  <rect class="ag" x="705.0" y="242" width="131.0" height="43"/>
  <text class="lab" x="162" y="270" text-anchor="end">Survey item B</text>
  <rect class="sd" x="173.0" y="308" width="37.9" height="43"/>
  <rect class="sd" x="212.9" y="308" width="91.1" height="43"/>
  <rect class="nu" x="306.0" y="308" width="297.2" height="43"/>
  <rect class="ag" x="605.2" y="308" width="97.8" height="43"/>
  <rect class="ag" x="705.0" y="308" width="131.0" height="43"/>
  <text class="lab" x="162" y="336" text-anchor="end">Survey item C</text>
  <rect class="sd" x="173.0" y="374" width="51.2" height="43"/>
  <rect class="sd" x="226.2" y="374" width="210.8" height="43"/>
  <rect class="nu" x="439.0" y="374" width="131.0" height="43"/>
  <rect class="ag" x="572.0" y="374" width="150.9" height="43"/>
  <rect class="ag" x="725.0" y="374" width="111.0" height="43"/>
  <text class="lab" x="162" y="402" text-anchor="end">Survey item D</text>
  <rect class="sd" x="173.0" y="440" width="104.4" height="43"/>
  <rect class="sd" x="279.4" y="440" width="164.2" height="43"/>
  <rect class="nu" x="445.6" y="440" width="210.8" height="43"/>
  <rect class="ag" x="658.5" y="440" width="117.7" height="43"/>
  <rect class="ag" x="778.2" y="440" width="57.9" height="43"/>
  <text class="lab" x="162" y="468" text-anchor="end">Survey item E</text>
</svg>
