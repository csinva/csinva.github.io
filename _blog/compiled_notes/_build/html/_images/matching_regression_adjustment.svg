<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 0 2630 430" role="img" aria-labelledby="title desc">
  <title id="title">Regression adjustment vs. matching</title>
  <desc id="desc">Three panels of outcome Y^T against covariate X_1 for control units (blue, Y^(T=0)) and treated units (red, Y^(T=1)). Observed data: both groups rise with X_1, controls above treated. Regression adjustment (linear): a line is fit to each group and used to impute unobserved counterfactuals, e.g. a control point's treated outcome is read off the red line and a treated point's control outcome off the blue line. Matching estimation (nearest-neighbor): each group's outcome is imputed by the nearest observed neighbor, giving step functions.</desc>
  <!-- drawn dark-on-transparent: the notes CSS inverts images (keeping hue) for the black background -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/></marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b0b0b0"/></marker>
    <style>
      text { fill: #2b2b2b; font-family: Helvetica, Arial, sans-serif; }
      .ax { fill: none; stroke: #2b2b2b; stroke-width: 3; }
      .lab { font-size: 28px; font-family: Georgia, "Times New Roman", serif; }
      .ttl { font-size: 30px; }
      .note { font-size: 24px; }
    </style>
  </defs>
