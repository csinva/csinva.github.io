  <defs>
    <style>
      .ln { fill: none; stroke: #2b2b2b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .lbl { font-family: Helvetica, Arial, sans-serif; fill: #2b2b2b; }
      .var { font-family: Georgia, "Times New Roman", serif; font-style: italic; fill: #2b2b2b; }

      .axis { fill: none; stroke: #8a8a8a; stroke-width: 2; }
      .stable { fill: none; stroke: #1f6fb2; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .unstable { fill: none; stroke: #1f6fb2; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 14 12; }
      .ax { font: italic 28px Georgia, "Times New Roman", serif; fill: #2b2b2b; }
    </style>
  </defs>
