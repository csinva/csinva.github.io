<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 6 380 350" role="img" aria-labelledby="title desc">
  <title id="title">Subcritical pitchfork bifurcation</title>
  <desc id="desc">Bifurcation diagram for dx/dt = λx + x³: the branch x = 0 is stable (solid) for λ &lt; 0 and unstable (dashed) for λ &gt; 0; two unstable branches x = ±√(−λ) exist for λ &lt; 0.</desc>
