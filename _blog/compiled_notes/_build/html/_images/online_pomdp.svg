  <ellipse class="nd" cx="712" cy="382" rx="54" ry="28" fill="#fff"/><text class="nm" x="708" y="392"><tspan class="b">E</tspan><tspan class="sb" dy="7">t+1</tspan></text>
  <rect class="nd" x="791" y="45" width="68" height="66" fill="#fff"/><text class="nm" x="825" y="88">A<tspan class="sb" dy="7">t+1</tspan></text>
