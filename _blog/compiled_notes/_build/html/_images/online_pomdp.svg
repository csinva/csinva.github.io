  <path class="nd" d="M1021 258 L1063 300 L1021 342 L979 300 Z" fill="#fff"/><text class="nm" x="1019" y="309" style="font-size:28px">R<tspan class="sb" dy="7">t+2</tspan></text>
  <path class="nd" d="M1335 149 L1379 193 L1335 237 L1291 193 Z" fill="#fff"/><text class="nm" x="1333" y="202" style="font-size:28px">U<tspan class="sb" dy="7">t+3</tspan></text>
</svg>