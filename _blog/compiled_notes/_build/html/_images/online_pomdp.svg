  <ellipse class="nd" cx="948" cy="382" rx="54" ry="28" fill="#fff"/><text class="nm" x="944" y="392"><tspan class="b">E</tspan><tspan class="sb" dy="7">t+2</tspan></text>
  <rect class="nd" x="1031" y="45" width="68" height="66" fill="#fff"/><text class="nm" x="1065" y="88">A<tspan class="sb" dy="7">t+2</tspan></text>
  <ellipse class="nd" cx="1187" cy="193" rx="56" ry="26" fill="#fff"/><text class="nm" x="1183" y="203"><tspan class="b">X</tspan><tspan class="sb" dy="7">t+3</tspan></text>
  <ellipse class="nd" cx="1187" cy="382" rx="54" ry="28" fill="#fff"/><text class="nm" x="1183" y="392"><tspan class="b">E</tspan><tspan class="sb" dy="7">t+3</tspan></text>
  <path class="nd" d="M310 258 L352 300 L310 342 L268 300 Z" fill="#cfcfcf"/><text class="nm" x="308" y="309" style="font-size:28px">R<tspan class="sb" dy="7">t−1</tspan></text>
