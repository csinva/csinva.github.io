<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 6 640 504" role="img" aria-labelledby="title desc">
  <title id="title">Messages in an undirected tree</title>
  <desc id="desc">(a) A fragment of an undirected graph: nodes i and j are neighbors, with i nearer to the root (an arrow labeled "to root" points up from i toward a region above), and two subtrees hang below j. (b) The messages created when nodes k, l and j are eliminated: m_kj(x_j) from k to j, m_lj(x_j) from l to j, and m_ji(x_i) from j up to i.</desc>
  <!-- drawn dark-on-transparent: the notes CSS inverts images (keeping hue) for the black background -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/>
    </marker>
    <style>
      .edge { fill: none; stroke: #2b2b2b; stroke-width: 2; stroke-linecap: round; }
      .node { fill: none; stroke: #2b2b2b; stroke-width: 2; }
      .var { font: italic 28px Georgia, "Times New Roman", serif; fill: #2b2b2b; }
      .sub { font-size: 19px; }
      .lab { font: 22px Helvetica, Arial, sans-serif; fill: #2b2b2b; }
      .panel { font: 24px Helvetica, Arial, sans-serif; fill: #2b2b2b; text-anchor: middle; }
    </style>
  </defs>

  <!-- (a) fragment of an undirected graph -->
  <ellipse class="node" cx="150" cy="40" rx="60" ry="32"/>
  <line class="edge" x1="150.0" y1="72.0" x2="150.0" y2="150.0"/>
  <line class="edge" x1="150.0" y1="190.0" x2="150.0" y2="255.0"/>
  <line class="edge" x1="138.6" y1="291.4" x2="105.0" y2="340.0"/>
  <line class="edge" x1="161.4" y1="291.4" x2="195.0" y2="340.0"/>
  <ellipse class="node" cx="75" cy="392" rx="38" ry="60" transform="rotate(30 75 392)"/>
  <ellipse class="node" cx="225" cy="392" rx="38" ry="60" transform="rotate(-30 225 392)"/>
  <circle class="node" cx="150" cy="170" r="20"/>
  <circle class="node" cx="150" cy="275" r="20"/>
  <line class="edge" x1="164" y1="124" x2="164" y2="94" marker-end="url(#arrow)"/>
  <text class="lab" x="176" y="117">to root</text>
  <text class="var" x="178" y="179">i</text>
  <text class="var" x="178" y="284">j</text>
  <text class="panel" x="150" y="500">(a)</text>

  <!-- (b) messages created when k, l and j are eliminated -->
  <line class="edge" x1="460.0" y1="80.0" x2="460.0" y2="205.0"/>
  <line class="edge" x1="450.2" y1="242.4" x2="379.8" y2="367.6"/>
  <line class="edge" x1="469.8" y1="242.4" x2="540.2" y2="367.6"/>
  <circle class="node" cx="460" cy="60" r="20"/>
  <circle class="node" cx="460" cy="225" r="20"/>
  <circle class="node" cx="370" cy="385" r="20"/>
  <circle class="node" cx="550" cy="385" r="20"/>
  <text class="var" x="488" y="69">i</text>
  <text class="var" x="488" y="234">j</text>
  <text class="var" x="340" y="394" text-anchor="end">k</text>
  <text class="var" x="580" y="394">l</text>
  <line class="edge" x1="473" y1="160" x2="473" y2="128" marker-end="url(#arrow)"/>
  <text class="var" x="486" y="152" text-anchor="start">m<tspan class="sub" dy="6">ji</tspan><tspan dy="-6">(x</tspan><tspan class="sub" dy="6">i</tspan><tspan dy="-6">)</tspan></text>
  <line class="edge" x1="388.5" y1="319.6" x2="410.1" y2="281.2" marker-end="url(#arrow)"/>
  <text class="var" x="384" y="300" text-anchor="end">m<tspan class="sub" dy="6">kj</tspan><tspan dy="-6">(x</tspan><tspan class="sub" dy="6">j</tspan><tspan dy="-6">)</tspan></text>
  <line class="edge" x1="531.5" y1="319.6" x2="509.9" y2="281.2" marker-end="url(#arrow)"/>
  <text class="var" x="536" y="300" text-anchor="start">m<tspan class="sub" dy="6">lj</tspan><tspan dy="-6">(x</tspan><tspan class="sub" dy="6">j</tspan><tspan dy="-6">)</tspan></text>
  <text class="panel" x="460" y="500">(b)</text>
</svg>
