<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 12 1116 1582" role="img" aria-labelledby="title desc">
  <title id="title">Typology of prompting methods</title>
  <desc id="desc">Tree of prompting methods with example works. Pre-trained models: left-to-right LM (GPT, GPT-2, GPT-3), masked LM (BERT, RoBERTa), prefix LM (UniLM1, UniLM2), encoder-decoder (T5, MASS, BART). Prompt engineering: shape (cloze, prefix) and human effort (hand-crafted; automated, discrete or continuous). Answer engineering: shape (token, span, sentence) and human effort (hand-crafted; automated, discrete or continuous). Multi-prompt learning: prompt ensemble, augmentation, composition, decomposition, sharing. Prompt-based training strategies: parameter updating (promptless fine-tuning, tuning-free prompting, fixed-LM prompt tuning, fixed-prompt LM tuning, prompt+LM tuning) and training sample size (few/zero-shot, full-data).</desc>
