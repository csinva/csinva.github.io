<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 20 1240 950" role="img" aria-labelledby="title desc">
  <title id="title">Double-slit experiment</title>
  <desc id="desc">A smiley-face photon source fires dashed paths toward a barrier with two slits; beyond the slits dashed paths fan out to a screen, beside which an interference pattern of several peaks is drawn. Text: probability of landing in a dark patch equals the squared magnitude of the sum of the amplitudes through slit 1 and slit 2, which is 0; yet if you close one of the slits, the photon can appear in that previously dark patch.</desc>
  <!-- drawn dark-on-transparent: the notes CSS inverts images (keeping hue) for the black background -->
