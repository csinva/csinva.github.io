  <text class="tx" x="68" y="730">Probability of landing in “dark patch” = <tspan font-family="Times New Roman, serif">|</tspan>amplitude<tspan font-family="Times New Roman, serif">|</tspan><tspan class="sb" dy="-18">2</tspan><tspan dy="18"> =</tspan></text>
  <text class="tx" x="68" y="792"><tspan font-family="Times New Roman, serif">|</tspan>amplitude<tspan class="sb" dy="12">Slit1</tspan><tspan dy="-12"> + amplitude</tspan><tspan class="sb" dy="12">Slit2</tspan><tspan dy="-12" font-family="Times New Roman, serif">|</tspan><tspan class="sb" dy="-18">2</tspan><tspan dy="18"> = 0</tspan></text>
