  <path d="M271.0 388.0 L271.0 425.0" fill="none" stroke="#a98bd0" stroke-width="28" stroke-linejoin="miter" stroke-linecap="butt"/>
  <polygon points="271.0,452.0 243.0,424.0 299.0,424.0" fill="#a98bd0"/>
  <path d="M372.0 66.0 L450.0 66.0 L450.0 425.0" fill="none" stroke="#e8a96a" stroke-width="28" stroke-linejoin="miter" stroke-linecap="butt"/>
  <polygon points="450.0,452.0 422.0,424.0 478.0,424.0" fill="#e8a96a"/>
  <path d="M133.0 171.0 L145.0 171.0" fill="none" stroke="#e88a87" stroke-width="7" stroke-linejoin="miter" stroke-linecap="butt"/>
  <polygon points="152.0,171.0 144.0,178.0 144.0,164.0" fill="#e88a87"/>
  <text class="c b" x="89" y="59.7" font-size="19">Central</text>
  <text class="c b" x="89" y="81.6" font-size="19">integration</text>
  <text class="c b" x="89" y="475.7" font-size="19">Reflex</text>
  <text class="c b" x="89" y="497.6" font-size="19">activity</text>
  <text class="c" x="271" y="478.0" font-size="19" style="fill:#1f6fb2">Visceral motor</text>
  <text class="c" x="271" y="499.9" font-size="19" style="fill:#1f6fb2">response</text>
  <text class="c" x="458" y="478.0" font-size="19" style="fill:#1f6fb2">Hormonal and</text>
  <text class="c" x="458" y="499.9" font-size="19" style="fill:#1f6fb2">behavioral response</text>
  <text class="note" x="304" y="286.0" font-size="22">Vagus nerve</text>
  <text class="note" x="484" y="295.0" font-size="24">Nucleus of</text>
  <text class="note" x="484" y="325.0" font-size="24">solitary</text>
  <text class="note" x="484" y="355.0" font-size="24">tract:</text>
  <text class="note" x="484" y="385.0" font-size="24">visceral</text>
  <text class="note" x="484" y="415.0" font-size="24">input output</text>
</svg>
