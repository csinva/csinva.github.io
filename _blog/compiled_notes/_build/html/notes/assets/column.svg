  <rect class="box" x="150" y="250" width="68" height="43"/><text class="bl" x="184.0" y="277.5">IVCα</text>
  <rect class="box" x="208" y="320" width="70" height="43"/><text class="bl" x="243.0" y="347.5">IVCβ</text>
