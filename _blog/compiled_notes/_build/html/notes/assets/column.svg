<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 8 535 712" role="img" aria-labelledby="title desc">
  <title id="title">Laminar connections of V1</title>
  <desc id="desc">Schematic of connections among the layers of primary visual cortex. Magnocellular layers of the lateral geniculate nucleus project to layer IVCα and parvocellular layers to IVCβ. IVCα projects to IVB and to layers II/III; IVCβ and IVB project to II/III. Layer VI sends input to IVCα, IVCβ and II/III. II/III and V are reciprocally connected, V projects to VI. Outputs (dashed): II/III and IVB to other cortical areas, V to the superior colliculus, VI back to the lateral geniculate nucleus.</desc>
  <!-- drawn dark-on-transparent: the notes CSS inverts images (keeping hue) for the black background -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/>
    </marker>
    <style>
      .ctx { fill: #8a8a8a; fill-opacity: 0.12; stroke: none; }
      .layer { fill: none; stroke: #8a8a8a; stroke-width: 1.2; }
      .box { fill: #f3f3f3; stroke: #d9822b; stroke-width: 1.5; }
      .bl { font: 17px Helvetica, Arial, sans-serif; fill: #2b2b2b; text-anchor: middle; }
      .a { fill: none; stroke: #2b2b2b; stroke-width: 2; stroke-linejoin: round; }
      .d { fill: none; stroke: #2b2b2b; stroke-width: 2; stroke-dasharray: 7 5; }
      .p { fill: none; stroke: #2b2b2b; stroke-width: 1.3; }
      .t { font: 18px Helvetica, Arial, sans-serif; fill: #2b2b2b; }
      .lgnp { fill: none; stroke: #8a8a8a; stroke-width: 6; stroke-linecap: round; }
      .lgnm { fill: none; stroke: #2b2b2b; stroke-width: 6; stroke-linecap: round; stroke-opacity: 0.75; }
    </style>
  </defs>
