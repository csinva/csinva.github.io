  <rect class="cell" x="526" y="674" width="25" height="24" fill="#f1c9da" opacity="1"/>
  <rect class="cell" x="551" y="674" width="25" height="24" fill="#f1c9da" opacity="1"/>
  <rect class="cell" x="576" y="674" width="25" height="24" fill="#f1c9da" opacity="1"/>
  <text class="v" x="240" y="616" style="fill:#1f6fb2" opacity="1">v<tspan font-size="15" dy="4">1</tspan></text>
  <rect class="cell" x="288" y="596" width="25" height="24" fill="#c6dcf1" opacity="1"/>
  <rect class="cell" x="313" y="596" width="25" height="24" fill="#c6dcf1" opacity="1"/>
  <rect class="cell" x="338" y="596" width="25" height="24" fill="#c6dcf1" opacity="1"/>
  <text class="v" x="474" y="616" style="fill:#1f6fb2" opacity="0.35">v<tspan font-size="15" dy="4">2</tspan></text>
