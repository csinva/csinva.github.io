  <rect class="cell" x="547" y="596" width="25" height="24" fill="#c6dcf1" opacity="0.25"/>
  <rect class="cell" x="572" y="596" width="25" height="24" fill="#c6dcf1" opacity="0.25"/>
  <text class="n" x="322" y="376"><tspan style="fill:#7b4fb5">q<tspan font-size="15" dy="4">1</tspan></tspan><tspan dy="-4" style="fill:#2b2b2b"> • </tspan><tspan style="fill:#d9822b">k<tspan font-size="15" dy="4">1</tspan></tspan><tspan dy="-4" style="fill:#8f7208"> = 112</tspan></text>
  <text class="n" x="558" y="376"><tspan style="fill:#7b4fb5">q<tspan font-size="15" dy="4">1</tspan></tspan><tspan dy="-4" style="fill:#2b2b2b"> • </tspan><tspan style="fill:#d9822b">k<tspan font-size="15" dy="4">2</tspan></tspan><tspan dy="-4" style="fill:#8f7208"> = 96</tspan></text>
  <text class="n" x="328" y="440" style="fill:#8f7208">14</text><text class="n" x="328" y="500" style="fill:#8f7208">0.88</text>
