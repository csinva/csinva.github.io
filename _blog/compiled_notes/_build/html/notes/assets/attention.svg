  <text class="v" x="474" y="126" style="fill:#1f8a4c" opacity="1">x<tspan font-size="15" dy="4">2</tspan></text>
  <rect class="cell" x="502" y="106" width="25" height="24" fill="#bfe3c9" opacity="1"/>
  <rect class="cell" x="527" y="106" width="25" height="24" fill="#bfe3c9" opacity="1"/>
