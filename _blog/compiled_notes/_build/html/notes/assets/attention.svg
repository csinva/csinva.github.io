  <text class="v" x="474" y="190" style="fill:#7b4fb5" opacity="1">q<tspan font-size="15" dy="4">2</tspan></text>
  <rect class="cell" x="522" y="170" width="25" height="24" fill="#ddd0f0" opacity="1"/>
  <rect class="cell" x="547" y="170" width="25" height="24" fill="#ddd0f0" opacity="1"/>
  <rect class="cell" x="572" y="170" width="25" height="24" fill="#ddd0f0" opacity="1"/>
  <text class="v" x="474" y="251" style="fill:#d9822b" opacity="1">k<tspan font-size="15" dy="4">2</tspan></text>
  <rect class="cell" x="522" y="231" width="25" height="24" fill="#f6d7b5" opacity="1"/>
  <rect class="cell" x="547" y="231" width="25" height="24" fill="#f6d7b5" opacity="1"/>
  <rect class="cell" x="572" y="231" width="25" height="24" fill="#f6d7b5" opacity="1"/>
  <text class="v" x="474" y="311" style="fill:#1f6fb2" opacity="1">v<tspan font-size="15" dy="4">2</tspan></text>
  <rect class="cell" x="522" y="291" width="25" height="24" fill="#c6dcf1" opacity="1"/>
  <rect class="cell" x="547" y="291" width="25" height="24" fill="#c6dcf1" opacity="1"/>
