<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 455" role="img" aria-labelledby="title desc">
  <title id="title">Phrase-structure tree</title>
  <desc id="desc">Constituency parse of 'the little bear saw the fine fat trout in the brook': S splits into NP (Det the, Nom: Adj little, N bear) and VP; VP splits into VP (V saw, NP: Det the, Nom: Adj fine, Adj fat, N trout) and PP (P in, NP: Det the, Nom: N brook).</desc>
