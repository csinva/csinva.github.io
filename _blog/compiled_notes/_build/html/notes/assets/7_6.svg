  <path class="ar" d="M684 478 L684 522" marker-end="url(#ah)"/>
  <text class="tx" x="578" y="550">Protein</text>
  <text class="tx" x="578" y="574">kinase C</text>
  <text class="tx" x="684" y="550">Ca<tspan font-size="15" dy="-9">2+</tspan></text>
  <text class="tx" x="684" y="574">release</text>
