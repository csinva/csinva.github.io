  <text class="rc" x="950" y="225.0">D2</text>
  <ellipse cx="950" cy="270" rx="44" ry="22" fill="#9cc0e6" stroke="#2b2b2b" stroke-width="2"/>
  <text class="tx" x="1010" y="314">G<tspan font-size="15" dy="5">i</tspan></text>
  <circle cx="928" cy="322" r="10" fill="#2b2b2b"/><path d="M923 322 H933" stroke="#fff" stroke-width="2.5"/>
  <path class="ar" d="M950 298 L950 342" marker-end="url(#ah)"/>
  <text class="tx" x="950" y="372">Adenylyl cyclase</text>
