<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 10 1110 702" role="img" aria-labelledby="title desc">
  <title id="title">Gs, Gq, Gi signaling pathways</title>
  <desc id="desc">Three G-protein pathways, by row: neurotransmitter, receptor, G-protein, effector protein, second messengers, later effectors, target action. Norepinephrine binds the beta-adrenergic receptor, activating Gs, which stimulates adenylyl cyclase, raising cAMP, activating protein kinase A, increasing protein phosphorylation. Glutamate binds mGluR, activating Gq, which activates phospholipase C, producing diacylglycerol (activating protein kinase C) and IP3 (causing Ca2+ release), which increase protein phosphorylation and activate calcium-binding proteins. Dopamine binds the dopamine D2 receptor, activating Gi, which inhibits adenylyl cyclase, lowering cAMP and protein kinase A, decreasing protein phosphorylation.</desc>
  <!-- drawn dark-on-transparent: the notes CSS inverts images (keeping hue) for the black background -->
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/></marker>
    <marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/></marker>
    <style>
      .lbl { fill: #cfe3e3; stroke: #2b2b2b; stroke-width: 1.5; }
      .rl { font: 19px Helvetica, Arial, sans-serif; fill: #2b2b2b; text-anchor: middle; }
      .tx { font: 22px Helvetica, Arial, sans-serif; fill: #2b2b2b; text-anchor: middle; }
      .rc { font: 19px Helvetica, Arial, sans-serif; fill: #2b2b2b; text-anchor: middle; }
      .ttl { font: 34px Georgia, "Times New Roman", serif; fill: #2b2b2b; }
      .ar { fill: none; stroke: #2b2b2b; stroke-width: 2.5; stroke-linecap: round; }
      .pt { fill: none; stroke: #2b2b2b; stroke-width: 3.5; stroke-linecap: round; }
    </style>
  </defs>
  <text class="ttl" x="62" y="52">Gs, Gq, Gi</text>
  <path class="lbl" d="M18 88 H128 L150 122.5 L128 157 H18 Z"/>
