  <text class="tx" x="305" y="670">phosphorylation</text>
  <text class="tx" x="625" y="112">Glutamate</text>
  <path d="M563 160 Q561 150 575 150 L607 150 Q625 176 643 150 L675 150 Q689 150 687 160 L681 232 Q679 248 661 248 L589 248 Q571 248 569 232 Z" fill="#f6c85f" stroke="#2b2b2b" stroke-width="2"/>
