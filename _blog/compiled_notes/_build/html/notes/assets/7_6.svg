  <path class="lbl" d="M18 163 H128 L150 202.5 L128 242 H18 Z"/>
  <text class="rl" x="72" y="209">Receptor</text>
  <path class="lbl" d="M18 248 H128 L150 290.0 L128 332 H18 Z"/>
  <text class="rl" x="72" y="299">G-protein</text>
  <path class="lbl" d="M18 338 H128 L150 375.0 L128 412 H18 Z"/>
  <text class="rl" x="72" y="366">Effector</text><text class="rl" x="72" y="392">protein</text>
  <path class="lbl" d="M18 418 H128 L150 457.5 L128 497 H18 Z"/>
  <text class="rl" x="72" y="452">Second</text><text class="rl" x="72" y="478">messengers</text>
  <path class="lbl" d="M18 503 H128 L150 546.0 L128 589 H18 Z"/>
  <text class="rl" x="72" y="540">Later</text><text class="rl" x="72" y="566">effectors</text>
  <path class="lbl" d="M18 595 H128 L150 652.0 L128 709 H18 Z"/>
  <text class="rl" x="72" y="646">Target</text><text class="rl" x="72" y="672">action</text>
  <rect x="160" y="85" width="315" height="507" fill="#f6c3bd"/>
  <rect x="475" y="85" width="315" height="507" fill="#fbe7a6"/>
  <rect x="790" y="85" width="315" height="507" fill="#d8c9e6"/>
  <rect x="160" y="592" width="945" height="112" fill="#fbd7b0"/>
  <rect x="155" y="182" width="955" height="62" fill="#c3cde6" stroke="#2b2b2b" stroke-width="1.5"/>
  <line x1="155" y1="213" x2="1110" y2="213" stroke="#2b2b2b" stroke-width="1" stroke-dasharray="4 4"/>
  <text class="tx" x="305" y="112">Norepinephrine</text>
  <path d="M243 160 Q241 150 255 150 L287 150 Q305 176 323 150 L355 150 Q369 150 367 160 L361 232 Q359 248 341 248 L269 248 Q251 248 249 232 Z" fill="#e8746b" stroke="#2b2b2b" stroke-width="2"/>
