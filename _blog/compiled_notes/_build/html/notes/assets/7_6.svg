  <path d="M888 160 Q886 150 900 150 L932 150 Q950 176 968 150 L1000 150 Q1014 150 1012 160 L1006 232 Q1004 248 986 248 L914 248 Q896 248 894 232 Z" fill="#a682c4" stroke="#2b2b2b" stroke-width="2"/>
