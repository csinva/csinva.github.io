<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 14 1270 560" role="img" aria-labelledby="title desc">
  <title id="title">Avoiding a secondary y-axis</title>
  <desc id="desc">Two alternatives to a dual-axis chart of quarterly revenue (bars, millions: 0.6, 0.5, 0.7, 0.9, 0.6, 0.6, 0.8, 1.0) and number of sales employees (line: 82, 91, 105, 112, 111, 109, 110, 110) for Q1 2013 to Q4 2014. Alternative 1 labels both series directly on one chart; alternative 2 pulls them apart into two vertically stacked charts with their own axes.</desc>
  <!-- drawn dark-on-transparent: the notes CSS inverts images (keeping hue) for the black background -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/>
    </marker>
    <marker id="garrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f8a4c"/>
    </marker>
    <style>
      .bar { fill: #1f6fb2; }
      .ln { fill: none; stroke: #1f3f6e; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
      .dot { fill: #1f3f6e; }
      .ax { fill: none; stroke: #8a8a8a; stroke-width: 1.5; }
      .title { font: 30px Helvetica, Arial, sans-serif; fill: #2b2b2b; }
      .num { font: 21px Helvetica, Arial, sans-serif; fill: #1f3f6e; text-anchor: middle; }
      .bl { font: bold 19px Helvetica, Arial, sans-serif; fill: #ffffff; text-anchor: middle; }
      .lab { font: 21px Helvetica, Arial, sans-serif; }
      .tick { font: 20px Helvetica, Arial, sans-serif; fill: #5a5a5a; }
      .yl { font: 20px Helvetica, Arial, sans-serif; fill: #5a5a5a; text-anchor: middle; }
    </style>
  </defs>
