      .dsh { stroke-dasharray: 5 5; }
      .e { fill: none; stroke: #2b2b2b; stroke-width: 2; }
      .t { font: 32px "Times New Roman", Georgia, serif; fill: #2b2b2b; text-anchor: middle; }
      .i { font-style: italic; }
      .b { font-weight: bold; }
      .s { font-size: 20px; }
    </style>
  </defs>
