<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 0 950 385" role="img" aria-labelledby="title desc">
  <title id="title">Counterfactual representation learning</title>
  <desc id="desc">Context x (mixed red and blue points) maps to a representation Φ. Φ and treatment t feed the outcome error loss(h(Φ, t), y). Φ feeds the imbalance term disc(Φ_C, Φ_T); t feeds the imbalance term by a dashed arrow. The outcome-error icon is a fitted curve with residuals; the imbalance icon is two shifted distributions.</desc>
