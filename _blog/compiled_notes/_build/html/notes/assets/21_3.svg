<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 712 705" role="img" aria-labelledby="title desc">
  <title id="title">Central autonomic network</title>
  <desc id="desc">Figure 21.7, a central autonomic network for the control of visceral motor function. Medial prefrontal cortex and insular cortex are reciprocally connected with each other and with the amygdala; the thalamus projects to insular cortex. The amygdala projects to the hypothalamus and to autonomic centers in the brainstem reticular formation. The parabrachial nucleus projects to the amygdala, hypothalamus and thalamus. The hypothalamus projects to the autonomic centers and to preganglionic neurons in brainstem and spinal cord; the autonomic centers project back to the hypothalamus and to the preganglionic neurons. The nucleus of the solitary tract projects to the hypothalamus, parabrachial nucleus, autonomic centers and preganglionic neurons. Preganglionic neurons drive primary motor neurons in autonomic ganglia, which drive the end organs (smooth muscle, cardiac muscle, and glands). End organs feed spinal visceral sensory neurons and cranial nerves IX and X, which feed the nucleus of the solitary tract.</desc>
