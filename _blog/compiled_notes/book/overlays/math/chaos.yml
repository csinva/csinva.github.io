# Overlay for _notes/math/chaos.md. Keys under `sections` are the note's header text (case and markup ignored).
map_label: Chaos           # short name on the start-page topic map
title: Nonlinear dynamics and chaos
hook: Bifurcations, stability of fixed points, maps that period-double into chaos, conservative systems and the Lorenz equations.
intro: |
  Most of this chapter is about fixed points: where they are, whether they are stable (linearize and look at the derivative, or the eigenvalues in more than one
  dimension), and how they appear, vanish or swap stability as a parameter changes. The bifurcation
  diagrams at the top show the four basic ways this happens in one dimension.

  Discrete maps come next. Iterating the logistic map shows the period-doubling route to chaos in a few
  lines of algebra. The chapter ends with conservative systems, where energy is conserved and the phase
  portrait follows its level curves (the pendulum), and with the Lorenz equations, a three-variable model
  of convection whose fixed points are worked out by hand.
sections:
  Normal forms of Hopf bifurcations:
    lead: |
      Four one-dimensional normal forms. In each diagram the parameter $\lambda$ is on the horizontal axis
      and the fixed points on the vertical axis; solid branches are stable and dashed ones unstable.
  important figs:
    lead: |
      Besides the figures, this section holds the basic vocabulary: phase space, phase portraits, bifurcation
      diagrams, and the kinds of stability. The working method is to find the fixed points first, then
      linearize: for $\dot{x} = f(x)$ near $\bar{x}$, the perturbation obeys $\dot{\delta x} = \delta x f'(\bar{x})$,
      so in one dimension $f'(\bar{x}) < 0$ means stable.
  Systems of Linear ODEs:
    lead: |
      Near a fixed point a nonlinear system behaves like its linearization, so these cases are the
      vocabulary for everything else. The sign of each eigenvalue's real part says whether trajectories
      move in or out along it, and an imaginary part makes them spiral.
  Discrete Nonlinear Dynamical Systems:
    lead: |
      Now time moves in steps: $x_{n+1} = f(x_n)$. A fixed point is stable when $|f'(x^*)| < 1$. For the
      logistic map $f(x) = \mu x(1-x)$, $f'(x^*) = 2 - \mu$ at the nonzero fixed point, so it loses stability
      at $\mu = 3$, where the first period doubling happens.
    viz:
      - name: logistic-cobweb
        params: {mu: 2.8, x0: 0.2}
        caption: |
          The cobweb plot iterates the map: go up to the curve, across to the diagonal, and repeat. At
          $\mu = 2.8$ the iterates spiral into the fixed point. Past 3 they settle on a period-2 orbit, past
          about 3.45 a period-4 one, and beyond about 3.57 the orbit never repeats. Try $\mu = 3.83$ for
          the period-3 window.
  Conservative Systems:
    lead: |
      Without friction the total energy is constant, so each trajectory stays on one level curve of
      $E = \frac{1}{2}m\dot{x}^2 + V(x)$. That is why the pendulum's phase portrait above is a family of closed
      orbits around the centers plus the rotations above and below.
  Hamiltonian Dynamical System:
    lead: |
      Motion generated by a single function $H$, with $\dot{x} = \partial H/\partial y$ and
      $\dot{y} = -\partial H/\partial x$. Fixed points can only be centers or saddles, and in two dimensions
      Poincare-Bendixson rules out chaos.
  Lorenz equations:
    lead: |
      Three ODEs for the leading coefficients of a convection model. Here $x, y, z$ are Fourier coefficients,
      not positions. The algebra below finds the fixed points and starts the linearization around them.
  Linearization of Lorenz Equations about FPs $\bar{\underline{x}}$:
    lead: |
      The same linearization as in one dimension, now with the matrix of partial derivatives of the three
      right-hand sides evaluated at a fixed point.
takeaways:
  - Analysis starts with the fixed points; linearizing around each one tells whether nearby trajectories approach or leave it.
  - In one dimension a fixed point of $\dot{x} = f(x)$ is stable when $f'(\bar{x}) < 0$; in higher dimensions the signs of the eigenvalues' real parts decide, and imaginary parts make trajectories spiral.
  - Bifurcations (pitchfork, saddle-node, transcritical) create, destroy or swap the stability of fixed points as a parameter changes.
  - For a map $x_{n+1} = f(x_n)$ a fixed point is stable when $\vert f'(x^*) \vert < 1$; the logistic map loses this at $\mu = 3$ and period-doubles into chaos.
  - In conservative systems energy is constant, so trajectories follow its level curves, and a 2D system cannot be chaotic.
  - The Lorenz equations are three ODEs for coefficients of a convection model; their fixed points $FP_\pm$ appear for $\rho_0 \geq 1$.
figures:
  pitch.svg: |
    Supercritical pitchfork, $\dot{x} = \lambda x - x^3$. The branch $x = 0$ is stable (solid) for
    $\lambda < 0$ and unstable (dashed) for $\lambda > 0$, where two stable branches $x = \pm\sqrt{\lambda}$ emerge.
  subpitch.svg: |
    Subcritical pitchfork, $\dot{x} = \lambda x + x^3$. The branch $x = 0$ is stable for $\lambda < 0$ and
    unstable for $\lambda > 0$; the two side branches $x = \pm\sqrt{-\lambda}$ exist for $\lambda < 0$ and are unstable.
  sn.svg: |
    Saddle-node, $\dot{x} = \lambda - x^2$. No fixed points for $\lambda < 0$; for $\lambda > 0$ a stable
    branch $x = \sqrt{\lambda}$ and an unstable branch $x = -\sqrt{\lambda}$ are born at the origin.
  trans.svg: |
    Transcritical, $\dot{x} = \lambda x - x^2$. The fixed points $x = 0$ and $x = \lambda$ cross at the
    origin and exchange stability.
  flip.svg: |
    Long-run values of $x$ under the logistic map $x \to \mu x(1-x)$ as $\mu$ grows: one fixed point up
    to $\mu = 3$, then period 2, period 4 near 3.45, and a cascade of doublings into chaos past about
    3.57, with periodic windows such as period 3 near 3.83.
  inverse.svg: |
    The third iterate $f^3$ of the logistic map just past the start of the period-3 window. Its
    intersections with the diagonal are the period-3 points: three stable ones (open circles), each next
    to an unstable one (filled).
  pendulum.svg: |
    Pendulum phase portrait, angle $\theta$ against angular velocity $\nu$. Closed orbits circle the
    stable centers at $\theta = 0, \pm 2\pi$; separatrices meet at the saddles at $\pm\pi$; the wavy curves
    above and below are full rotations.
  e_surface.svg: |
    A double-well energy surface. Trajectories run around the surface along level curves of constant
    energy, not down it: low energies stay in one well, high energies circle both.
